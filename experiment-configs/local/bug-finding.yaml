# Local bug-finding with Claude Code CRS.
#
# Usage:
#   uv run crsbench run --config experiment-configs/local/bug-finding.yaml
#
# Required env (claude-code via external LiteLLM proxy):
#   CRSBENCH_LLM_UPSTREAM_BASE_URL, CRSBENCH_LLM_UPSTREAM_MASTER_KEY

experiment:
  name: local-bug-finding
  task: bugfinding
  benchmark_suite: smoke/all
  mode: delta

runtime:
  trials: 1
  max_total_time: 76800
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 14400
  per_pov_verify_timeout: 300
  redis_host: localhost
  pov_early_stop: true
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  experiment_filestore: .run/local/experiment-data/local-bug-finding
  report_filestore: .run/local/report-data/local-bug-finding

resources:
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
