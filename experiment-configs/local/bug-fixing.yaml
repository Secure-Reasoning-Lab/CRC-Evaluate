# Local bug-fixing with Claude Code CRS.
#
# Consumes ground-truth POVs from the benchmark suite (no prior finding run needed).
# For pipeline mode that chains a real finding run, see full-pipeline-fixing.yaml.
#
# Usage:
#   uv run crsbench run --config experiment-configs/local/bug-fixing.yaml
#
# Required env: LITELLM_UPSTREAM_BASE_URL, CRSBENCH_LLM_UPSTREAM_MASTER_KEY

experiment:
  name: local-bug-fixing
  task: bugfixing
  benchmark_suite: smoke/all
  mode: delta

runtime:
  trials: 1
  max_total_time: 43200
  build_timeout: 21600
  run_timeout: 7200
  verify_timeout: 10800
  per_pov_verify_timeout: 300
  redis_host: localhost
  inputs:
    pov:
      max_variants_per_cpv: 1
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  experiment_filestore: .run/local/experiment-data/local-bug-fixing
  report_filestore: .run/local/report-data/local-bug-fixing

worker:
  jobs: 8
  cores_per_job: 8

resources:
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
