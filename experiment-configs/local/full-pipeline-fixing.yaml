# Local full-pipeline phase 2 (bug-fixing) with Claude Code CRS.
#
# Consumes POVs produced by full-pipeline-finding.yaml. Run that config first
# and confirm POVs exist under the path referenced by inputs.pov.from_experiment_by_crs.

experiment:
  name: local-full-pipeline-fixing
  task: bugfixing
  benchmark_suite: smoke/sanity
  mode: delta

runtime:
  trials: 1
  max_total_time: 9000
  build_timeout: 1800
  run_timeout: 1800
  verify_timeout: 1200
  redis_host: localhost
  inputs:
    pov:
      max_variants_per_cpv: 1
      from_experiment_by_crs:
        crs-claude-code: .run/local/experiment-data/local-full-pipeline-finding/local-full-pipeline-finding/local-full-pipeline-finding/crs-bug-finding-claude-code
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  experiment_filestore: .run/local/experiment-data/local-full-pipeline-fixing
  report_filestore: .run/local/report-data/local-full-pipeline-fixing

resources:
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
