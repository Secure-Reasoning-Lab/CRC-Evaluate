# Local full-pipeline phase 2 (bug-fixing) with Claude Code CRS.
#
# Consumes POVs produced by bug-finding.yaml. Run that config first and confirm
# POVs exist under the path referenced by inputs.pov.from_experiment_by_crs.
#
# Usage:
#   uv run crsbench run --config experiment-configs/local/bug-finding.yaml
#   uv run crsbench run --config experiment-configs/local/full-pipeline-fixing.yaml

experiment:
  name: local-full-pipeline-fixing
  task: bugfixing
  benchmark_suite: smoke/all
  mode: delta

runtime:
  trials: 1
  max_total_time: 43200
  build_timeout: 21600
  run_timeout: 7200
  verify_timeout: 10800
  per_pov_verify_timeout: 300
  redis_host: localhost
  inputs:
    pov:
      max_variants_per_cpv: 1
      from_experiment_by_crs:
        crs-claude-code: .run/local/experiment-data/local-bug-finding/local-bug-finding/local-bug-finding/crs-bug-finding-claude-code
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  experiment_filestore: .run/local/experiment-data/local-full-pipeline-fixing
  report_filestore: .run/local/report-data/local-full-pipeline-fixing

resources:
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
