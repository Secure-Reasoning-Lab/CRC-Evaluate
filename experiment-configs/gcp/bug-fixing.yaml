# GCP bug-fixing with Claude Code CRS (ground-truth POV input).
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen
#   3. HF_TOKEN, CRSBENCH_LLM_UPSTREAM_BASE_URL, CRSBENCH_LLM_UPSTREAM_MASTER_KEY in env
#
# Usage:
#   CONFIG=experiment-configs/gcp/bug-fixing.yaml
#   uv run crsbench cloud launch    --config "$CONFIG"
#   uv run crsbench cloud monitor   --config "$CONFIG"
#   uv run crsbench cloud collect   --config "$CONFIG" --force
#   uv run crsbench cloud teardown  --config "$CONFIG" --force

experiment:
  name: gcp-bug-fixing
  task: bugfixing
  benchmark_suite: smoke/all
  mode: auto

runtime:
  trials: 1
  max_total_time: 43200
  build_timeout: 21600
  run_timeout: 7200
  verify_timeout: 10800
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: 1
  litellm:
    mode: external
    cost_budget: 10.0

storage:
  experiment_filestore: /data/crsbench/experiment-data/gcp-bug-fixing
  report_filestore: /data/crsbench/report-data/gcp-bug-fixing

resources:
  cores_per_trial: 16
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 16
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6

worker:
  jobs: 4
  cores_per_job: 16
  storage:
    cleanup_after_trial: true

evaluator:
  jobs: 2
  cores_per_job: 8

cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-east1
        - us-east5
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 512
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-64
          boot_disk_size_gb: 1024
        gce-evaluator-n2d: {}
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {}
