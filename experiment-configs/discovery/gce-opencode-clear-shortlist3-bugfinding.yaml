# GCE discovery run: opencode-clear bug-finding against OSS-Fuzz
# shortlist 3 refill (28 harnesses across 8 projects).
#
# Selection rationale (2026-04-28):
#   - Refill shortlist 3 with OSS-Fuzz projects that are NOT already in
#     CRSBench/benchmark-suites/ and are NOT present in shortlist 1-2.
#   - Favor projects whose current OSS-Fuzz build scripts expose multiple
#     explicit native fuzz targets, so the shortlist can stay near 28 harnesses
#     without depending on a single oversized project.
#   - Harness names below come from the current OSS-Fuzz `build.sh` outputs and
#     were locally validated before the GCE run.
#
# Managed cloud bootstrap materializes the selected OSS-Fuzz projects from the
# sparse third_party/oss-fuzz checkout and generates .aixcc/meta.yaml on each
# VM before the run starts.
#
# Usage:
#   CONFIG=experiment-configs/discovery/gce-opencode-clear-shortlist3-bugfinding.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

description: 'GCE discovery run: opencode-clear bug-finding on OSS-Fuzz shortlist 3'

experiment:
  name: gce-discovery-opencode-clear-shortlist3
  task: bugfinding
  mode: full
  benchmarks:
    # === C / C++ ===
    - openssh:
        - pubkey_fuzz
        - privkey_fuzz
        - sig_fuzz
        - authopt_fuzz
        - sshsig_fuzz
        - sshsigopt_fuzz
        - kex_fuzz
        - agent_fuzz
    - libraw:
        - libraw_fuzzer
        - libraw_cr2_fuzzer
        - libraw_nef_fuzzer
        - libraw_raf_fuzzer
    - speex:
        - speex_encode_fuzzer_fixed
        - speex_encode_fuzzer_float
        - speex_decode_fuzzer_fixed
        - speex_decode_fuzzer_float
    - libical:
        - libical_fuzzer
        - libical_extended_fuzzer
        - libicalvcard_fuzzer
    - nghttp2:
        - nghttp2_fuzzer_frames
        - nghttp2_fuzzer
        - nghttp2_fuzzer_fdp
    - jsoncpp:
        - jsoncpp_fuzzer
        - jsoncpp_proto_fuzzer
    - c-ares:
        - ares_parse_reply_fuzzer
        - ares_create_query_fuzzer
    - iperf:
        - cjson_fuzzer
        - auth_fuzzer
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: third_party/oss-fuzz/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 76800
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 14400
  skip_verification: true
  source_mode: main_repo
  redis_host: redis-server:6379
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 30.0

storage:
  experiment_filestore: /data/crsbench/experiment-data/gce-opencode-clear-shortlist3-bugfinding
  report_filestore: /data/crsbench/report-data/gce-opencode-clear-shortlist3-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode-clear:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 16
  memory_per_trial: "64G"

worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true

cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 10800
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 512
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d:
          machine_type: n2d-standard-128
          boot_disk_size_gb: 1024
        gce-worker-n2d:
          machine_type: n2d-standard-224
          boot_disk_size_gb: 4096
        gce-evaluator-n2d: {}
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {} # worker 1
      - {} # worker 2
