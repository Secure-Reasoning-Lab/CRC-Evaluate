# Test Configuration for Inc-Build Image Loading Fix
#
# Test wireshark projects to verify inc-build image retag in docker root works correctly

# Experiment identifier
experiment: "test-inc-build-wireshark"

# Human-readable description
description: "Test inc-build image loading fix with wireshark projects"

# Execution Configuration
trials: 1
max_total_time: 9600  # 2 hours total

# CRS Selection
crses:
  - atlantis-claude-code

mode: all

# Explicit list of wireshark benchmarks
benchmarks:
  - afc-wireshark-delta-01
  - afc-wireshark-delta-02
  - afc-wireshark-delta-03
  - afc-wireshark-delta-04
  - afc-wireshark-delta-05
  - afc-wireshark-delta-07
  - afc-wireshark-full-01

# Difficulty Control
difficulty_level: 1

# Build Configuration
build_timeout: 3600   # 1 hour
run_timeout: 3600     # 1 hour
verify_timeout: 1200  # 20 minutes

# Monitoring & Snapshots
snapshot_period: 300  # 5 minutes

# Hints disabled for this evaluation
hints_enabled: false

# Source mode: use bundled pkgs/ instead of git clone
source_mode: pkgs

# LiteLLM Configuration
litellm_mode: passthrough

# Redis Configuration
redis_host: localhost

# Resource Allocation
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
  litellm:
    cost_budget: 100.0  # $100 per trial

# Storage Configuration (local SSD for fast I/O)
experiment_filestore: /mnt/ssd2/acorn421/crsbench/test-inc-build-wireshark/experiment-data
report_filestore: /mnt/ssd2/acorn421/crsbench/test-inc-build-wireshark/report-data

# Worker settings
worker:
  jobs: 6
  redis_host: localhost
  continuous: true

# Reproducibility
git_hash: null
