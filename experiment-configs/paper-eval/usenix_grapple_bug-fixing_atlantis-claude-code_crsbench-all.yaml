# USENIX Evaluation Configuration for Bug-Fixing CRS
#
# Comprehensive evaluation of atlantis-claude-code CRS on all benchmarks
# Run on Grapple with results copied to NFS

# Experiment identifier
experiment: "usenix-grapple-bug-fixing-eval"

# Human-readable description
description: "USENIX evaluation for bug-fixing CRS on all benchmarks"

# Execution Configuration
trials: 1
max_total_time: 7200  # 2 hours total

# CRS Selection
crses:
  - atlantis-claude-code

mode: all
adapter: oss-crs

benchmark_suite: usenix-r1

# Difficulty Control
difficulty_level: 1

# Build Configuration
build_timeout: 1800   # 30 minutes
run_timeout: 3600     # 1 hour
verify_timeout: 1200  # 20 minutes

# Monitoring & Snapshots
snapshot_period: 300  # 5 minutes

# Hints disabled for this evaluation
hints_enabled: false

# Source mode: use bundled pkgs/ instead of git clone
source_mode: pkgs

# LiteLLM Configuration
litellm_mode: external

# Redis Configuration
redis_host: localhost

# Resource Allocation
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
  litellm:
    cost_budget: 100.0  # $100 per trial

# Storage Configuration (local SSD for fast I/O)
experiment_filestore: /mnt/ssd2/acorn421/crsbench/usenix-grapple-bug-fixing-eval-3/experiment-data
report_filestore: /mnt/ssd2/acorn421/crsbench/usenix-grapple-bug-fixing-eval-3/report-data

# NFS result transfer settings (copy after each trial)
copy_results_after_trial: true
results_filestore: /mnt/crsbench_nfs/crsbench/grapple/usenix-grapple-bug-fixing-eval

# Disk cleanup (delete local artifacts after transfer to NFS)
cleanup_after_trial: true

# Worker settings (4 local workers)
worker:
  jobs: 4
  redis_host: localhost
  continuous: true

# Reproducibility
git_hash: null
