# Test Experiment Configuration for Smoke Testing of Bug Finding CRSes
#
# This is a minimal configuration for testing CRSBench distributed execution
# with Redis-based job queue and atlantis-multilang-given_fuzzer CRS.

# Experiment identifier
experiment: "ramjet-bug-finding-smoke-testing"

# Human-readable description
description: "Smoke testing for distributed bug finding"

# Execution Configuration
trials: 1
max_total_time: 5000

# CRS Selection
crses:
  - atlantis-multilang-given_fuzzer

mode: all

benchmark_suite: smoke-test-bug-finding

# Difficulty Control
difficulty_level: 1

# Monitoring & Snapshots - more frequent for testing
snapshot_period: 300  # 5 minutes

# Storage Configuration - temporary directories for testing
experiment_filestore: /tmp/ramjet-bug-finding-smoke-testing/experiment-data
report_filestore: /tmp/ramjet-bug-finding-smoke-testing/report-data

# Build Configuration
build_timeout: 600
run_timeout: 3600
verify_timeout: 600

hints_enabled: false

# Distributed Execution Configuration
redis_host: localhost

# Reproducibility
git_hash: null
