# Cloud config: v4 rerun for 6 benchmarks not fully tested in v2/v3-partial.
#
# Fleet: 1 orchestrator (n2d-standard-16)
#        2 workers (n2d-standard-224, 14 jobs × 16 cores each)
#        1 evaluator (n2d-standard-128, 8 jobs × 16 cores)
#
# Scope:
#   afc-curl-delta-01        — Native (C), FD collateral in v2
#   afc-tika-full-01         — JVM, FD collateral in v2
#   atlanta-freetype2-delta-01 — Native (C), oss-crs TARGET_SOURCE mount bug (fixed in 930a309 PR#133)
#   atlanta-libxml2-delta-01 — Native (C), never attempted in v2
#   atlanta-sqlite-jdbc-delta-01 — JVM, oss-crs docker-down 120s timeout (fixed in 930a309 PR#173)
#   atlanta-struts-delta-01  — JVM, exceeded 14400s build_timeout (bumped to 21600 here)
#
# Excluded (benchmark bugs, not runnable without patch):
#   - atlanta-feign-full-01  — license-maven-plugin JVM NPE
#   - atlanta-kylin-delta-01 — TLS cert expired on repository.kyligence.io

experiment:
  name: non-afc-final-bf-given-fuzzer-v4
  task: bugfinding
  benchmark_suite: crsbench-v4-rerun
  sanitizers:
    - address
    - undefined
  mode: full
runtime:
  trials: 3
  max_total_time: 64800
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/non-afc-final-bf-given-fuzzer-v4
  report_filestore: /data/crsbench/report-data/non-afc-final-bf-given-fuzzer-v4
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 16
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: false
evaluator:
  jobs: 8
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-224
          boot_disk_size_gb: 2048
        gce-evaluator-n2d:
          machine_type: n2d-standard-128
          boot_disk_size_gb: 2048
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {} # worker 1
      - {} # worker 2
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
