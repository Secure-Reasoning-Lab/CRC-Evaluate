# Cloud config: v3 rerun of 16 benchmarks that didn't complete in v2.
#
# Fleet: 1 orchestrator (n2d-standard-16)
#        3 workers (n2d-standard-224, 14 jobs × 16 cores each)
#        1 evaluator (n2d-standard-128, 8 jobs × 16 cores)
#
# Scope: 16 benchmarks × ~25 CPV-harnesses × 3 trials × 2 sanitizers = ~150 trial-jobs.
# Target wall-clock: ~36h (4 waves × 9h).
#
# Excludes from v2 crsbench-except-afc-final suite:
#   - atlanta-jenkins-delta-01 (real jazzer_driver FD leak, upstream unfixed)
#   - atlanta-feign-full-01 (license-maven-plugin JVM NPE, benchmark patch needed)
#   - atlanta-kylin-delta-01 (TLS cert expired on repository.kyligence.io)
#
# Pre-flight fixes required before launch:
#   1. oss-crs bump that fixes SourceType.TARGET_SOURCE mount for freetype2
#   2. oss-crs `docker compose down` cleanup timeout >120s for sqlite-jdbc
#   3. build_timeout raised 14400 → 21600 (handled here)
#
# Usage:
#   CONFIG=experiment-configs/crsbench-except-afc-final-bugfinding/gce-v3-rerun-given-fuzzer.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: non-afc-final-bf-given-fuzzer-v3
  task: bugfinding
  benchmark_suite: crsbench-v3-rerun
  sanitizers:
    - address
    - undefined
  mode: full
runtime:
  trials: 3
  max_total_time: 57600
  build_timeout: 21600   # bumped from 14400 for struts/tika-delta-01
  run_timeout: 28800
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/non-afc-final-bf-given-fuzzer-v3
  report_filestore: /data/crsbench/report-data/non-afc-final-bf-given-fuzzer-v3
resources:
  cores_per_trial: 16
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 16
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: false
evaluator:
  jobs: 8
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-224
          boot_disk_size_gb: 2048
        gce-evaluator-n2d:
          machine_type: n2d-standard-128
          boot_disk_size_gb: 2048
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {} # worker 1
      - {} # worker 2
      - {} # worker 3
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
