# 3 trials × the CRSBench suite excluding AFC final benchmarks, 16 cores per trial.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/crsbench-except-afc-final-bugfinding/gce-atlantis-multilang-except-afc-final.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: atlantis-multilang-except-afc-final
  task: bugfinding
  benchmark_suite: crsbench-except-afc-final
  sanitizers:
    - address
    - undefined
  mode: auto
runtime:
  trials: 3
  max_total_time: 91200
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 28800 # a lot of benchmarks!
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: false
  inc_build_enabled: false
  pov_early_stop: true
  litellm:
    mode: external
    cost_budget: 30.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/atlantis-multilang-except-afc-final
  report_filestore: /data/crsbench/report-data/atlantis-multilang-except-afc-final
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-wo-concolic:
    num_cores: 16
    mem_limit: "64G"
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 14
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 1 TB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd — 14 concurrent jobs need disk
        gce-evaluator-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd — holds Docker build cache
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
      - {}
      - {}
      - {}
      - {}
      # - {} # 6 workers x 224 vCPUs
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
