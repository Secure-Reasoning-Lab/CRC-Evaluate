# Cloud sanity config: 2 C + 2 JVM benchmarks with given_fuzzer on GCE.
#
# Fleet: 1 orchestrator (n2d-standard-16) + 1 worker (n2d-standard-16) + 1 evaluator (n2d-standard-16)
# All VMs use pd-ssd boot disks.
#
# This config is designed as a quick cloud smoke test (~30 min) to verify:
#   - VM provisioning and bootstrap
#   - HF_TOKEN passthrough for benchmark download
#   - Cpuset isolation (1 job x 8 cores)
#   - Seed and POV collection
#   - Evaluator build and verify flow
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. export HF_TOKEN="hf_your_token"
#
# Usage:
#   CONFIG=experiment-configs/sanity-bugfinding/cloud-given_fuzzer-default.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: cloud-sanity-given-fuzzer
  task: bugfinding
  benchmarks:
    # 2 C/C++ benchmarks (small, fast to build)
    - afc-libavif-delta-02
    - afc-mongoose-delta-01
    # 2 JVM benchmarks
    - afc-log4j2-delta-01
    - afc-pdfbox-delta-01
  sanitizers:
    - address
  mode: full
  only_cpv_harnesses: true
runtime:
  trials: 1
  max_total_time: 7800
  build_timeout: 3600
  run_timeout: 300
  verify_timeout: 3600
  per_pov_verify_timeout: 180
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/cloud-sanity-given-fuzzer
  report_filestore: /data/crsbench/report-data/cloud-sanity-given-fuzzer
resources:
  cores_per_trial: 8
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 8
worker:
  jobs: 1
  cores_per_job: 8
  storage:
    cleanup_after_trial: false  # keep all data for inspection
evaluator:
  jobs: 1
  cores_per_job: 8
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: feat/gcp
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 200
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 200 GB pd-ssd
        gce-worker-n2d: {}      # n2d-standard-16, 200 GB pd-ssd
        gce-evaluator-n2d: {}   # n2d-standard-16, 200 GB pd-ssd
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
      count: 1
    placements:
      - {} # 1 worker VM (1 job x 8 cores = 8 vCPUs)
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
      count: 1
    placements:
      - {} # 1 evaluator VM (1 job x 8 cores = 8 vCPUs)
