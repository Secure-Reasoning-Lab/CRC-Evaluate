experiment:
  name: gce-sanity-1orch-2worker
  task: bugfinding
  benchmark_suite: sanity
  mode: delta
runtime:
  trials: 1
  max_total_time: 3600
  build_timeout: 600
  run_timeout: 600
  verify_timeout: 600
  redis_host: redis-server:6379
  inputs:
    pov:
      max_variants_per_cpv: 1
  litellm:
    skip: true
storage:
  experiment_filestore: /tmp/crsbench/experiment-data
  report_filestore: /tmp/crsbench/report-data
resources:
  cores_per_trial: 2
  memory_per_trial: 4G
worker:
  storage:
    cleanup_after_trial: true
  cores_per_job: 2
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 2
evaluator:
  cores_per_job: 4
cloud:
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
    env_passthrough:
      common:
        - CRSBENCH_LLM_UPSTREAM_BASE_URL
        - CRSBENCH_LLM_MASTER_KEY
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      instance_profiles:
        orchestrator-n2d:
          machine_type: n2d-standard-16
          boot_disk_size_gb: 50
          image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
          service_account_email: 153298433405-compute@developer.gserviceaccount.com
          owner_label: yufu
          readiness_timeout_sec: 1200
          crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
          crsbench_git_ref: feat/gcp
          github_deploy_key_file: file:.crsbench-keys/crsbench-deploy
          hf_token: os.environ/HF_TOKEN
        worker-n2d:
          machine_type: n2d-standard-16
          boot_disk_size_gb: 50
          image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
          service_account_email: 153298433405-compute@developer.gserviceaccount.com
          owner_label: yufu
          readiness_timeout_sec: 1200
          crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
          crsbench_git_ref: feat/gcp
          github_deploy_key_file: file:.crsbench-keys/crsbench-deploy
          hf_token: os.environ/HF_TOKEN
  orchestrator:
    provider: gce
    zone: us-east5-b
    instance_profile: orchestrator-n2d
  workers:
    placements:
      - provider: gce
        zone: us-east5-b
        worker_count: 1
        instance_profile: worker-n2d
      - provider: gce
        zone: us-east1-b
        worker_count: 1
        instance_profile: worker-n2d
