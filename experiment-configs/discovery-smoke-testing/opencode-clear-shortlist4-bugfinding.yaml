# Local discovery smoke: opencode-clear bug-finding against OSS-Fuzz shortlist 4
# refill (28 harnesses across 10 projects).
#
# This config uses an extracted OSS-Fuzz projects mirror under `.run/` so local
# `benchmark init` does not depend on sparse checkout state in
# `third_party/oss-fuzz/projects`.
#
# Prep the local shortlist mirror:
#   SHORTLIST_ROOT=.run/discovery-smoke-testing/oss-fuzz-shortlist4
#   rm -rf "$SHORTLIST_ROOT"
#   mkdir -p "$SHORTLIST_ROOT"
#   for p in hpn-ssh libyang kamailio giflib skcms http-parser highwayhash mpg123 capstone cmark; do
#     git -C third_party/oss-fuzz archive --format=tar HEAD "projects/$p" | tar -xf - -C "$SHORTLIST_ROOT"
#   done
#
# These projects are outside the existing CRSBench benchmark suites and outside
# the current shortlist 1-3 project set. Harness names come from current
# OSS-Fuzz `build.sh` outputs and should be validated locally with
# `crsbench benchmark init` before a GCE campaign.
#
# Usage:
#   CONFIG=experiment-configs/discovery-smoke-testing/opencode-clear-shortlist4-bugfinding.yaml
#   uv run crsbench benchmark init --experiment-config "$CONFIG" --jobs 4 --cpuset-cpus 32-63
#   uv run crsbench run --experiment-config "$CONFIG" --dry-run --local-only
#   uv run crsbench run --experiment-config "$CONFIG" --local-only

description: 'Local discovery smoke: opencode-clear bug-finding on OSS-Fuzz shortlist 4'

experiment:
  name: discovery-smoke-opencode-clear-shortlist4-bugfinding
  task: bugfinding
  mode: full
  benchmarks:
    - hpn-ssh:
        - pubkey_fuzz
        - privkey_fuzz
        - sig_fuzz
        - authopt_fuzz
        - sshsig_fuzz
        - sshsigopt_fuzz
        - kex_fuzz
        - agent_fuzz
    - libyang:
        - lyd_parse_mem_json
        - lyd_parse_mem_xml
        - lys_parse_mem
    - kamailio:
        - fuzz_parse_msg
        - fuzz_uri
    - giflib:
        - dgif_target
        - egif_target
        - dgif_protobuf_target
    - skcms:
        - iccprofile_info
        - iccprofile_atf
        - iccprofile_transform
    - http-parser:
        - fuzz_parser
        - fuzz_url
    - highwayhash:
        - highwayhash_fuzzer
        - sip_hash_fuzzer
    - mpg123:
        - read_fuzzer
        - decode_fuzzer
    - capstone:
        - fuzz_disasmnext
        - fuzz_disasmv5
    - cmark:
        - cmark_fuzzer
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: .run/discovery-smoke-testing/oss-fuzz-shortlist4/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 2460
  build_timeout: 1800
  run_timeout: 540
  verify_timeout: 60
  skip_verification: true
  source_mode: main_repo
  redis_host: localhost
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 0.5

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/discovery-smoke-testing/results/opencode-clear-shortlist4-bugfinding
  experiment_filestore: .run/discovery-smoke-testing/experiment-data/opencode-clear-shortlist4-bugfinding
  report_filestore: .run/discovery-smoke-testing/report-data/opencode-clear-shortlist4-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode-clear:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 8
  memory_per_trial: "32G"
