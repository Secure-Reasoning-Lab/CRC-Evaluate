# GCE discovery smoke: opencode bug-finding against OSS-Fuzz go-yaml (Go).
#
# Managed cloud bootstrap can materialize projects/go-yaml from the sparse
# third_party/oss-fuzz checkout and generate .aixcc/meta.yaml on each VM.
#
# Usage:
#   CONFIG=experiment-configs/discovery-smoke-testing/gce-opencode-go-yaml-bugfinding.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force
#
description: 'GCE discovery smoke: opencode bug-finding on OSS-Fuzz go-yaml (Go)'

experiment:
  name: gce-discovery-smoke-opencode-go-yaml
  task: bugfinding
  mode: full
  benchmarks:
    - go-yaml
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: third_party/oss-fuzz/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 2400
  build_timeout: 1800
  run_timeout: 300
  verify_timeout: 60
  skip_verification: true
  source_mode: main_repo
  redis_host: redis-server:6379
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 1.0

storage:
  experiment_filestore: /data/crsbench/experiment-data/gce-opencode-go-yaml-bugfinding
  report_filestore: /data/crsbench/report-data/gce-opencode-go-yaml-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 8
  memory_per_trial: "32G"

worker:
  jobs: 1
  cores_per_job: 8
  storage:
    cleanup_after_trial: true

evaluator:
  jobs: 1
  cores_per_job: 4

cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1800
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 512
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d: {}
        gce-evaluator-n2d: {}
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {}
