# GCE smoke test — full-pipeline phase 2 (bug-fixing).
#
# Consumes the POVs produced by gce-smoke-full-pipeline-finding.yaml and
# matches each fixing CRS to its corresponding finding CRS via
# inputs.pov.from_experiment_by_crs. Pairings:
#
#   crs-bug-finding-claude-code           -> crs-claude-code
#   crs-bug-finding-claude-code-old-model -> crs-claude-code-old-model
#   crs-bug-finding-claude-code-old-cli   -> crs-claude-code-old-cli
#   crs-bug-finding-opencode              -> crs-opencode
#
# CPVs that a given finding CRS did not discover are skipped at trial-matrix
# generation for the matching fixing CRS. If a CRS's finding subtree is empty
# that CRS is excluded from the fixing run.
#
# Prerequisites:
#   1. Phase 1 completed:
#      - gce-smoke-full-pipeline-finding launched, monitored to completion
#      - cloud collect --force pulled results locally
#      - cloud teardown --force released the phase-1 cluster
#   2. By default, cloud collect publishes phase-1 results under:
#      /data/crsbench/experiment-data/gce-smoke-full-pipeline-finding/
#        gce-smoke-full-pipeline-finding/
#      with per-CRS subdirectories beneath that experiment directory.
#      If you collected phase 1 elsewhere (for example with --dest), update the
#      from_experiment_by_crs paths below before launching phase 2.
#
# Usage:
#   CONFIG=experiment-configs/smoke-testing/gce-smoke-full-pipeline-fixing.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: gce-smoke-full-pipeline-fixing
  task: bugfixing
  mode: auto
  benchmarks:
    # Same 4 benchmarks as the finding phase. CPV selection is automatic —
    # per-CRS trials are only scheduled for CPVs each finding CRS discovered.
    - afc-curl-delta-05: [curl_fuzzer_dict]
    - afc-libexif-delta-03: [exif_from_data_fuzzer]
    - afc-libxml2-delta-03: [html]
    - afc-mongoose-delta-02: [fuzz]
  sanitizers:
    - address

runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: 1
      # Per-CRS mapping of prior finding-experiment subtrees. Each path is a
      # local directory on the operator's machine; cloud launch uploads only
      # the pov_store.json + CPV blobs + fallback crash logs to every VM at
      # /var/lib/crsbench/from-experiment/<exp_name>/by-crs/<crs>/.
      from_experiment_by_crs:
        crs-claude-code:            /data/crsbench/experiment-data/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/crs-bug-finding-claude-code
        crs-claude-code-old-model:  /data/crsbench/experiment-data/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/crs-bug-finding-claude-code-old-model
        crs-claude-code-old-cli:    /data/crsbench/experiment-data/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/crs-bug-finding-claude-code-old-cli
        crs-opencode:               /data/crsbench/experiment-data/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/gce-smoke-full-pipeline-finding/crs-bug-finding-opencode
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  experiment_filestore: /data/crsbench/experiment-data/gce-smoke-full-pipeline-fixing
  report_filestore: /data/crsbench/report-data/gce-smoke-full-pipeline-fixing

resources:
  cores_per_trial: 8
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-5-20251101
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-cli:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.0.17
  crs-opencode:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

worker:
  jobs: 8
  cores_per_job: 8
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 2
  cores_per_job: 4

cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_EVALUATOR_ROUTING_MODEL: dispatcher
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 512
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-64
          boot_disk_size_gb: 1024
        gce-evaluator-n2d:
          machine_type: n2d-standard-16
          boot_disk_size_gb: 512
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}   # 1 worker x 8 jobs
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {}   # 1 evaluator x 2 jobs
