# Local smoke test — full-pipeline phase 1 (bug-finding).
#
# Runs 4 CRS variants in one multi-CRS bug-finding experiment on the
# operator's local machine (no GCE):
#   crs-bug-finding-claude-code              (current claude-code: opus-4-6, CLI 2.1.92)
#   crs-bug-finding-claude-code-old-model    (old model: opus-4-5, CLI 2.1.92)
#   crs-bug-finding-claude-code-old-cli      (old harness: opus-4-6, CLI 2.0.17)
#   crs-bug-finding-opencode                 (opencode: GLM-5.1)
#
# Benchmarks: 4 small C delta benchmarks — enough to exercise the pipeline
# without large build/verify budgets.
#
# Pair with: smoke-full-pipeline-fixing.yaml. That config consumes the POVs
# this run produces via inputs.pov.from_experiment_by_crs, matching each
# finding CRS to its corresponding fixing CRS.
#
# Prerequisites:
#   1. Local Redis running on localhost:6379.
#   2. Benchmarks listed below prepared under ``benchmarks/``.
#   3. HF_TOKEN in .env or environment (opencode needs HF models).
#
# Usage:
#   uv run crsbench run --experiment-config experiment-configs/smoke-testing/smoke-full-pipeline-finding.yaml

description: 'Smoke test: full-pipeline phase 1 (bug-finding) across 4 CRS variants'

experiment:
  name: smoke-full-pipeline-finding
  task: bugfinding
  mode: auto
  benchmarks:
    - afc-curl-delta-05: [curl_fuzzer_dict]
    - afc-libexif-delta-03: [exif_from_data_fuzzer]
    - afc-libxml2-delta-03: [html]
    - afc-mongoose-delta-02: [fuzz]
  sanitizers:
    - address

crs_compose:
  crs-bug-finding-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-bug-finding-claude-code-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-5-20251101
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-bug-finding-claude-code-old-cli:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.0.17
  crs-bug-finding-opencode:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

runtime:
  trials: 3
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  rts_enabled: true
  inc_build_enabled: true
  pov_early_stop: true
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/smoke-testing/results/smoke-full-pipeline-finding
  experiment_filestore: .run/smoke-testing/experiment-data/smoke-full-pipeline-finding
  report_filestore: .run/smoke-testing/report-data/smoke-full-pipeline-finding

worker:
  jobs: 10
  cores_per_job: 8

evaluator:
  jobs: 2
  cores_per_job: 4

resources:
  memory_per_trial: "64G"
