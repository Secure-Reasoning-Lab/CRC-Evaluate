# CRSBench experiment configuration
# Generated by: crsbench gen-config
#
# Reference: docs/experiment-config-distributed-example.yaml
# Validate with: crsbench gen-config --validate --output <file>

description: 'Smoke test: smoke-bug-finding-open-model'

experiment:
  name: smoke-bug-finding-open-model
  task: bugfinding
  mode: auto
  benchmarks:
  - afc-curl-delta-05: [curl_fuzzer_dict]
  - afc-libexif-delta-03: [exif_from_data_fuzzer]
  - afc-libxml2-delta-03: [html]
  - afc-mongoose-delta-02: [fuzz]
  - afc-apache-poi-full-01: [POIPOIFSDumpFuzzer]
  - afc-log4j2-delta-01: [SimpleLoggerFuzzer]
  - afc-pdfbox-delta-01: [PDFOCRFuzzer]
  - afc-tika-delta-01: [HtmlParserFuzzer]

# Per-CRS resource allocation. Adjust num_cores/mem_limit per CRS.
# Additional options: mem_limit, additional_env
crs_compose:
  crs-bug-finding-claude-code-glm-5-1:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: zai-org/GLM-5.1
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-bug-finding-claude-code-gpt-oss-120b:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: vertex_ai/gpt-oss-120b
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-bug-finding-claude-code-gpt-oss-20b:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: vertex_ai/gpt-oss-20b
      CLAUDE_CODE_CLI_VERSION: 2.1.92

# Runtime settings. For distributed mode, add redis_host.
# Additional options: per_pov_verify_timeout, snapshot_period,
#   pov_early_stop, litellm, inputs (pov/sarif/seed/diff)
runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  rts_enabled: true
  inc_build_enabled: true
  pov_early_stop: true
  litellm:
    mode: external

# Storage paths. For distributed mode, consider shared mount points.
# Additional options: keep_only_results, cleanup_after_trial,
#   copy_results_after_trial, results_filestore
storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/smoke-testing/results/smoke-bug-finding-open-model
  experiment_filestore: .run/smoke-testing/experiment-data/smoke-bug-finding-open-model
  report_filestore: .run/smoke-testing/report-data/smoke-bug-finding-open-model

# Worker settings — parallel trial execution capacity.
# Additional options: continuous, worker_name, minimum_disk_size
worker:
  jobs: 10
  cores_per_job: 8

# Evaluator settings — parallel POV build/verify capacity.
# Additional options: idle_timeout, build_jobs, verify_jobs
evaluator:
  jobs: 2
  cores_per_job: 4

resources:
  memory_per_trial: 48g
