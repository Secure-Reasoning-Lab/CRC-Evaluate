# Local smoke test — full-pipeline phase 2 (bug-fixing).
#
# Consumes the POVs produced by smoke-full-pipeline-finding.yaml and matches
# each fixing CRS to its corresponding finding CRS via
# inputs.pov.from_experiment_by_crs. Pairings:
#
#   crs-bug-finding-claude-code           -> crs-claude-code
#   crs-bug-finding-claude-code-old-model -> crs-claude-code-old-model
#   crs-bug-finding-claude-code-old-cli   -> crs-claude-code-old-cli
#   crs-bug-finding-opencode              -> crs-opencode
#
# CPVs that a given finding CRS did not discover are skipped at trial-matrix
# generation for the matching fixing CRS. If a CRS's finding subtree is empty
# that CRS is excluded from the fixing run.
#
# Prerequisites:
#   1. Phase 1 completed:
#      uv run crsbench run --experiment-config \
#        experiment-configs/smoke-testing/smoke-full-pipeline-finding.yaml
#      Produces .run/smoke-testing/experiment-data/smoke-full-pipeline-finding/
#      with per-CRS subdirectories.
#   2. Local Redis running on localhost:6379.
#
# Usage:
#   uv run crsbench run --experiment-config experiment-configs/smoke-testing/smoke-full-pipeline-fixing.yaml

description: 'Smoke test: full-pipeline phase 2 (bug-fixing) with per-CRS POV routing'

experiment:
  name: smoke-full-pipeline-fixing
  task: bugfixing
  mode: auto
  benchmarks:
    # Same 4 benchmarks as the finding phase. CPV selection is automatic —
    # per-CRS trials are only scheduled for CPVs each finding CRS discovered.
    - afc-curl-delta-05: [curl_fuzzer_dict]
    - afc-libexif-delta-03: [exif_from_data_fuzzer]
    - afc-libxml2-delta-03: [html]
    - afc-mongoose-delta-02: [fuzz]
  sanitizers:
    - address

crs_compose:
  crs-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-5-20251101
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-cli:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.0.17
  crs-opencode:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

runtime:
  trials: 3
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: 1
      # Per-CRS mapping of prior finding-experiment subtrees. Each key is a
      # fixing-CRS name from crs_compose; each value is the on-disk path to
      # the matching finding CRS's subtree under the phase-1 experiment
      # filestore. CRSes not present in the map are skipped in phase 2.
      from_experiment_by_crs:
        crs-claude-code:           .run/smoke-testing/experiment-data/smoke-full-pipeline-finding/smoke-full-pipeline-finding/crs-bug-finding-claude-code
        crs-claude-code-old-model: .run/smoke-testing/experiment-data/smoke-full-pipeline-finding/smoke-full-pipeline-finding/crs-bug-finding-claude-code-old-model
        crs-claude-code-old-cli:   .run/smoke-testing/experiment-data/smoke-full-pipeline-finding/smoke-full-pipeline-finding/crs-bug-finding-claude-code-old-cli
        crs-opencode:              .run/smoke-testing/experiment-data/smoke-full-pipeline-finding/smoke-full-pipeline-finding/crs-bug-finding-opencode
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/smoke-testing/results/smoke-full-pipeline-fixing
  experiment_filestore: .run/smoke-testing/experiment-data/smoke-full-pipeline-fixing
  report_filestore: .run/smoke-testing/report-data/smoke-full-pipeline-fixing

worker:
  jobs: 10
  cores_per_job: 8

evaluator:
  jobs: 2
  cores_per_job: 4

resources:
  memory_per_trial: "64G"
