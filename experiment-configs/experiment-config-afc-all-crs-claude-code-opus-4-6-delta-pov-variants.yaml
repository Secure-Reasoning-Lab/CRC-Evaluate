# AFC All benchmarks with crs-claude-code pinned to Opus 4.6
# Auto mode (delta preferred) + all available POV variants per CPV

experiment: afc-all-crs-claude-code-opus-4-6-auto-pov-variants

trials: 1
mode: auto
adapter: oss-crs

# Timeout profile: 4h build + 2h run + 4h verify (+1h buffer)
max_total_time: 39600
build_timeout: 14400
run_timeout: 7200
verify_timeout: 14400
per_pov_verify_timeout: 7200

# Use all available POV variants for CPVs that provide variants.
# Benchmarks without variants are unaffected.
max_pov_variants_per_cpv: null

difficulty_level: 1

experiment_filestore: /home/dongkwan/crsbench_eval_patch/experiment-data
report_filestore: /home/dongkwan/crsbench_eval_patch/report-data

crses:
  - crs-claude-code

# AFC Final benchmarks that include POV variant blobs (pov_1+)
benchmark_suite: afc-final-variants

# Distributed execution
redis_host: localhost

# Persistent build cache

litellm_mode: external

llm_tracking_enabled: true

resources:
  cores_per_trial: 8
  litellm:
    max_concurrent_requests: 5
    cost_budget: 10

# Model override for crs-claude-code runtime
crs_overrides:
  crs-claude-code:
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-4-6
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-6
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-opus-4-6
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-opus-4-6

worker:
  # Reserve CPUs 112-127 for evaluator (16 cores total).
  # Worker uses CPUs 0-111: floor(112 / 8) = 14 parallel trial jobs.
  jobs: 14
  cores: "0-111"
  cleanup_after_trial: false
