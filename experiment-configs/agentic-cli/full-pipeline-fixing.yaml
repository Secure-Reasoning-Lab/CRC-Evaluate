# Local multi-CRS full-pipeline phase 2 (bug-fixing) across agentic CLIs.
#
# Consumes per-CRS POVs produced by full-pipeline-finding.yaml. Each fixing CRS
# only sees POVs from its matching finding counterpart.

experiment:
  name: agentic-cli-full-pipeline-fixing
  task: bugfixing
  benchmark_suite: smoke/sanity
  mode: delta

runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 3600
  run_timeout: 3600
  verify_timeout: 2400
  redis_host: localhost
  inputs:
    pov:
      max_variants_per_cpv: 1
      from_experiment_by_crs:
        crs-claude-code: .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/crs-bug-finding-claude-code
        crs-codex:       .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/crs-bug-finding-codex
        crs-copilot-cli: .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/crs-bug-finding-copilot-cli
        crs-gemini-cli:  .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/crs-bug-finding-gemini-cli
        crs-opencode:    .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/agentic-cli-full-pipeline-finding/crs-bug-finding-opencode
  litellm:
    mode: external
    cost_budget: 20.0

storage:
  experiment_filestore: .run/agentic-cli/experiment-data/agentic-cli-full-pipeline-fixing
  report_filestore: .run/agentic-cli/report-data/agentic-cli-full-pipeline-fixing

resources:
  memory_per_trial: "64G"

crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 8
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
  crs-codex:
    num_cores: 8
    additional_env:
      CRS_AGENT: codex
      OPENAI_MODEL: gpt-5-4
  crs-copilot-cli:
    num_cores: 8
    additional_env:
      CRS_AGENT: copilot_cli
      COPILOT_MODEL: gpt-5-4
  crs-gemini-cli:
    num_cores: 8
    additional_env:
      CRS_AGENT: gemini_cli
      GEMINI_MODEL: gemini-3-1-pro-preview
  crs-opencode:
    num_cores: 8
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1
