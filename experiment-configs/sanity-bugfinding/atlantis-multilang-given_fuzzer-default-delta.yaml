experiment:
  name: sanity-test
  task: bugfinding
  benchmark_suite: sanity
  mode: delta
runtime:
  trials: 1
  max_total_time: 1200
  build_timeout: 300
  run_timeout: 300
  verify_timeout: 300
  pov_early_stop: true
  redis_host: localhost
  inputs:
    pov:
      max_variants_per_cpv: 1
    sarif:
      level: 5
    diff: {}
  litellm:
    skip: true
storage:
  experiment_filestore: /tmp/crsbench/sanity/experiment-data/sanity-test
  report_filestore: /tmp/crsbench/sanity/report-data/sanity-test
worker:
  jobs: 3
  cores_per_job: 8
  storage:
    cleanup_after_trial: true
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 8
evaluator:
  jobs: 1
  cores_per_job: 8
