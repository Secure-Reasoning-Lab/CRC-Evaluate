# Coverage E2E Test - mock-c and mock-java with multilang CRS
#
# Tests: Build, Run, Corpus, Coverage (LLVM-cov + JaCoCo), Snapshots, Saturation
#
# Usage:
#   uv run crsbench --experiment-config experiment-configs/coverage-e2e-test.yaml
#
# Expected Results:
#   - C: LLVM-cov line-level coverage, saturation detection after ~2min no progress
#   - Java: JaCoCo coverage, saturation detection
#   - 10 snapshots (one per minute)

experiment: coverage-e2e-test

trials: 1
mode: delta
adapter: oss-crs
max_total_time: 180  # 3 minutes
difficulty_level: 1

experiment_filestore: /tmp/crsbench/crsbench/experiments/coverage-e2e-test
report_filestore: /tmp/crsbench/crsbench/reports/coverage-e2e-test

# Use oss-crs registry and temp config dir (atlantis-multilang -> given_fuzzer)
registry_dir: ./oss-crs/registry
crs_configs_dir: ./oss-crs/example_configs/

crses:
  - atlantis-multilang-given_fuzzer
benchmarks:
  - sanity-mock-c-delta-01
  - sanity-mock-java-delta-01

# Snapshot every 60 seconds (10 snapshots over 10 minutes)
snapshot_period: 60

# Enable coverage collection with saturation detection
coverage_enabled: true
coverage_saturation_time: 60  # Saturated if no new coverage for 60 secs

# Early stop on saturation (not yet implemented - detection only for now)
# When true: terminate trial early when coverage saturates
# When false: continue running until max_total_time (default)
coverage_early_stop: true

# LiteLLM mode (use proxy for local testing)
litellm_mode: null
