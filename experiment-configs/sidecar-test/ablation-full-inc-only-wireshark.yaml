# Ablation B (wireshark-only): incremental build ON, RTS OFF — incremental rebuild + full test suite
experiment:
  name: ablation-full-inc-only-wireshark
  task: bugfixing
  mode: auto
  sanitizers:
  - address
  benchmarks:
  - afc-wireshark-delta-01
  - afc-wireshark-delta-02
  - afc-wireshark-delta-03
  - afc-wireshark-delta-04
  - afc-wireshark-delta-05
  - afc-wireshark-delta-07
  - afc-wireshark-full-01
  - atlanta-wireshark-delta-01
runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 3600
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  skip_verification: true
  rts_enabled: false
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: 1
    ground_truth_patch: {}
storage:
  experiment_filestore: /tmp/crsbench/ablation-full/inc-only-wireshark/experiment-data
  report_filestore: /tmp/crsbench/ablation-full/inc-only-wireshark/report-data
  copy_results_after_trial: true
  results_filestore: /mnt/crsbench_nfs/crsbench/ramjet/ablation-inc-only-wireshark
  cleanup_after_trial: true
crs_compose:
  builder-sidecar-lite:
    num_cores: 4
resources:
  memory_per_trial: "64G"
worker:
  jobs: 10
  cores_per_job: 8
evaluator:
  jobs: 2
  cores_per_job: 4
