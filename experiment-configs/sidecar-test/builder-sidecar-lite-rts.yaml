# RTS (Regression Test Selection) test using builder-sidecar-lite.
#
# Covers all three RTS modes:
#   - jcgeks     (JVM): afc-apache-commons-compress-delta-06, atlanta-sqlite-jdbc-delta-01
#   - openclover (JVM): atlanta-activemq-delta-01, afc-zookeeper-delta-01
#   - binaryrts  (C):   afc-libxml2-delta-01, afc-freerdp-delta-01
#
# RTS env vars (RTS_ON, RTS_TOOL) are auto-injected by crsbench from each
# benchmark's project.yaml when rts_mode != "none" and inc_build = true.
#
# Usage:
#   crsbench run --experiment-config experiment-configs/sidecar-test/builder-sidecar-lite-rts.yaml

experiment:
  name: builder-sidecar-lite-rts-test
  task: bugfixing
  mode: auto
  sanitizers:
    - address
  benchmarks:
    # jcgeks (JVM)
    - afc-apache-commons-compress-delta-06
    - atlanta-sqlite-jdbc-delta-01
    # openclover (JVM)
    - atlanta-activemq-delta-01
    - afc-zookeeper-delta-01
    # binaryrts (C/C++)
    - afc-libxml2-delta-01
    - afc-freerdp-delta-01

runtime:
  trials: 1
  max_total_time: 7200
  build_timeout: 1800
  run_timeout: 3600
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  skip_verification: true
  inputs:
    pov:
      max_variants_per_cpv: 1
    ground_truth_patch: {}

storage:
  experiment_filestore: /tmp/crsbench/sidecar-test-rts/experiment-data
  report_filestore: /tmp/crsbench/sidecar-test-rts/report-data
  copy_results_after_trial: true
  results_filestore: /mnt/crsbench_nfs/crsbench/ramjet/builder-sidecar-lite-rts-test
  cleanup_after_trial: true

crs_compose:
  builder-sidecar-lite:
    num_cores: 4

worker:
  jobs: 6
  cores_per_job: 8

evaluator:
  jobs: 2
  cores_per_job: 4
