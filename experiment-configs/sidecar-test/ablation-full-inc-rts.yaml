runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 3600
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  skip_verification: true
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: null
    ground_truth_patch: {}
storage:
  experiment_filestore: .run/crsbench/ablation-full/inc-rts/experiment-data
  report_filestore: .run/crsbench/ablation-full/inc-rts/report-data
  copy_results_after_trial: true
  results_filestore: /mnt/crsbench_nfs/crsbench/cyclonus/ablation-inc-rts
  cleanup_after_trial: true
crs_compose:
  builder-sidecar-lite:
    num_cores: 16
resources:
  memory_per_trial: "64G"
worker:
  jobs: 6
  cores_per_job: 16
evaluator:
  jobs: 8
  cores_per_job: 16
