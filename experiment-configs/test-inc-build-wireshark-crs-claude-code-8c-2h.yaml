# Test Configuration for Inc-Build Image Loading Fix (8-core / 2h run profile)
#
# Derived from test-inc-build-wireshark.yaml for crs-claude-code with:
# - 8 cores per trial
# - 2 hour run timeout per trial

# Experiment identifier
experiment: "test-inc-build-wireshark-claude-8c-2h"

# Human-readable description
description: "Test inc-build image loading fix with wireshark projects (crs-claude-code, 8 cores, 2h run timeout)"

# Execution Configuration
trials: 1
# Must be > build_timeout + run_timeout + verify_timeout (3600 + 7200 + 1200 = 12000)
max_total_time: 12600  # 3.5 hours total

# CRS Selection
crses:
  - crs-claude-code

mode: all
adapter: oss-crs

# Explicit list of wireshark benchmarks
benchmarks:
  - afc-wireshark-delta-01
  - afc-wireshark-delta-02
  - afc-wireshark-delta-03
  - afc-wireshark-delta-04
  - afc-wireshark-delta-05
  - afc-wireshark-delta-07
  - afc-wireshark-full-01

# Difficulty Control
difficulty_level: 1

# Build Configuration
build_timeout: 3600   # 1 hour
run_timeout: 7200     # 2 hours
verify_timeout: 1200  # 20 minutes

# Monitoring & Snapshots
snapshot_period: 300  # 5 minutes

# Hints disabled for this evaluation
hints_enabled: false

# Source mode: use bundled pkgs/ instead of git clone
source_mode: pkgs

# LiteLLM Configuration
litellm_mode: external

llm_tracking_enabled: true

crs_overrides:
  crs-claude-code:

# Redis Configuration
redis_host: localhost

# Resource Allocation
resources:
  cores_per_trial: 8
  memory_per_trial: "64G"
  litellm:
    cost_budget: 100.0  # $100 per trial

# Storage Configuration (local SSD for fast I/O)
experiment_filestore: /mnt/ssd2/acorn421/crsbench/test-inc-build-wireshark-claude-8c-2h/experiment-data
report_filestore: /mnt/ssd2/acorn421/crsbench/test-inc-build-wireshark-claude-8c-2h/report-data

# Worker settings
# 16-core host recommendation: use 2 jobs for 8 cores/trial.
worker:
  jobs: 2
  redis_host: localhost
  continuous: true

# Reproducibility
git_hash: null
