# AFC final bug-fixing — full-pipeline phase 2 (production scale).
#
# 3 trials × all AFC benchmarks × 4 CRS variants, 16 cores per trial.
# Each fixing CRS pairs with its finding counterpart:
#
#   crs-bug-finding-claude-code           -> crs-claude-code
#   crs-bug-finding-claude-code-old-model -> crs-claude-code-old-model
#   crs-bug-finding-claude-code-old-cli   -> crs-claude-code-old-cli
#   crs-bug-finding-opencode              -> crs-opencode
#
# CPVs that a given finding CRS did not discover are skipped at trial-matrix
# generation for the matching fixing CRS. If a CRS's finding subtree is empty
# that CRS is excluded from the fixing run.
#
# Prerequisites:
#   1. Phase 1 completed:
#      - afc-final-bugfinding/gce-full-pipeline-finding-afc.yaml launched, monitored
#      - cloud collect --force pulled results locally
#      - cloud teardown --force released the phase-1 cluster
#   2. By default, cloud collect publishes phase-1 results under:
#      /data/crsbench/experiment-data/afc-full-pipeline-finding/
#        afc-full-pipeline-finding/afc-full-pipeline-finding/
#      with per-CRS subdirectories beneath that experiment directory.
#      If you collected phase 1 elsewhere, update the from_experiment_by_crs
#      paths below before launching phase 2.
#   3. gcloud auth login && gcloud auth application-default login
#   4. HF_TOKEN in .env or environment (opencode needs HF models)
#
# Usage:
#   CONFIG=experiment-configs/afc-final-bugfixing/gce-full-pipeline-fixing-afc.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: afc-full-pipeline-fixing
  task: bugfixing
  benchmark_suite: afc-final-no-wireshark
  sanitizers:
    - address
    - undefined
  mode: auto
runtime:
  trials: 3
  max_total_time: 43200          # build 6h + run 2h + verify 3h + 1h buffer
  build_timeout: 21600           # 6h — same as multilang bugfinding
  run_timeout: 7200
  verify_timeout: 10800          # 3h (extended for bug-fixing patch variant sweep)
  per_pov_verify_timeout: 300    # 5min — same as multilang bugfinding
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: true
  inc_build_enabled: true
  patch_verify_variants: true
  inputs:
    pov:
      max_variants_per_cpv: 1
      from_experiment_by_crs:
        crs-claude-code:            /data/crsbench/experiment-data/afc-full-pipeline-finding/afc-full-pipeline-finding/afc-full-pipeline-finding/crs-bug-finding-claude-code
        crs-claude-code-old-model:  /data/crsbench/experiment-data/afc-full-pipeline-finding/afc-full-pipeline-finding/afc-full-pipeline-finding/crs-bug-finding-claude-code-old-model
        crs-claude-code-old-cli:    /data/crsbench/experiment-data/afc-full-pipeline-finding/afc-full-pipeline-finding/afc-full-pipeline-finding/crs-bug-finding-claude-code-old-cli
        crs-opencode:               /data/crsbench/experiment-data/afc-full-pipeline-finding/afc-full-pipeline-finding/afc-full-pipeline-finding/crs-bug-finding-opencode
  litellm:
    mode: external
    cost_budget: 30.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/afc-full-pipeline-fixing
  report_filestore: /data/crsbench/report-data/afc-full-pipeline-fixing
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  crs-claude-code:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-model:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-5-20251101
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-claude-code-old-cli:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.0.17
  crs-opencode:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 14
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 1 TB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 4096        # 4 TB pd-ssd — 14 concurrent jobs need disk
        gce-evaluator-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 4096        # 4 TB pd-ssd — holds Docker build cache
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
      - {}
      - {} # 3 workers x 224
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
