# Remaining 2 trials x CRSBench suite excluding AFC final benchmarks, Claude Code bug-finding, 16 cores per trial, seed corpus enabled.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/ccs-bugfinding/gce-cc-finding-original-except-afc-final-corpus-rerun-remaining2.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: cc-find-except-afc-final-corpus-rerun-rem2
  task: bugfinding
  benchmark_suite: crsbench-except-afc-final
  sanitizers:
    - address
    - undefined
  mode: auto
runtime:
  trials: 2
  max_total_time: 91200
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 28800 # a lot of benchmarks!
  per_pov_verify_timeout: 300
  skip_verification: true
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: false
  inc_build_enabled: false
  pov_early_stop: true
  inputs:
    seed: {}
  litellm:
    mode: external
    cost_budget: 30.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/cc-find-except-afc-final-corpus-rerun-rem2
  report_filestore: /data/crsbench/report-data/cc-find-except-afc-final-corpus-rerun-rem2
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-claude-code:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 14
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data/cc-find-except-afc-final-corpus-rerun-rem2
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
        - us-west1
        - us-west2
        - us-west3
        - us-west4
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 1 TB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs - 14 jobs x 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd - 14 concurrent jobs need disk
        gce-evaluator-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs - 14 jobs x 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd - holds Docker build cache
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      # 10 workers max with current live quota:
      # us-south1 x2, us-east5 x2, and one each in us-central1,
      # us-east1, us-west1, us-west2, us-west3, us-west4.
      # asia-south1 has orchestrator headroom only, not enough free N2D CPUs
      # for a new n2d-standard-224 worker.
      - regions: [us-south1, us-east5, us-west1, us-west2, us-west3, us-west4, us-east1, us-central1]
      - regions: [us-east5, us-south1, us-west1, us-west2, us-west3, us-west4, us-east1, us-central1]
      - regions: [us-west1, us-south1, us-east5, us-west2, us-west3, us-west4, us-east1, us-central1]
      - regions: [us-west2, us-south1, us-east5, us-west1, us-west3, us-west4, us-east1, us-central1]
      - regions: [us-west3, us-south1, us-east5, us-west1, us-west2, us-west4, us-east1, us-central1]
      - regions: [us-west4, us-south1, us-east5, us-west1, us-west2, us-west3, us-east1, us-central1]
      - regions: [us-east1, us-south1, us-east5, us-west1, us-west2, us-west3, us-west4, us-central1]
      - regions: [us-central1, us-south1, us-east5, us-west1, us-west2, us-west3, us-west4, us-east1]
      - regions: [us-south1, us-east5, us-west1, us-west2, us-west3, us-west4, us-east1, us-central1]
      - regions: [us-east5, us-south1, us-west1, us-west2, us-west3, us-west4, us-east1, us-central1]
  # evaluators:
  #   defaults:
  #     instance_profile: gce-evaluator-n2d
  #   placements:
  #     - {} # evaluator 1
  #     - {} # evaluator 2
  #     - {} # evaluator 3
