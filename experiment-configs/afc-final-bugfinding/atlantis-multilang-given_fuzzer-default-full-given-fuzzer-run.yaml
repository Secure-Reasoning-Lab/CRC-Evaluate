experiment:
  name: afc-bugfinding-given-fuzzer-run
  task: bugfinding
  benchmark_suite: afc-final
  sanitizers:
  - address
  - undefined
  mode: full
#  only_cpv_harnesses: true
runtime:
  trials: 3
  max_total_time: 46800
  build_timeout: 14400
  run_timeout: 600
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
#    tracking_enabled: false
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/afc-bugfinding-given-fuzzer-run
  report_filestore: /data/crsbench/report-data/afc-bugfinding-given-fuzzer-run
resources:
  cores_per_trial: 16
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 16
worker:
  jobs: 1
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 2
  cores_per_job: 4
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: feat/gcp
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-east5
        - us-east1
        - us-south1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {} # inherit profile defaults (1 TB pd-ssd)
        gce-worker-n2d: {} # inherit profile defaults (1 TB pd-ssd)
        gce-evaluator-n2d:
          boot_disk_size_gb: 2048 # 2 TB pd-ssd — holds Docker build cache
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
      count: 1
    placements:
      - {} # one worker VM per placement; 3 placements = 3 workers (one trial each)
      - {}
      - {}
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
      count: 1
    placements:
      - {} # one evaluator VM
