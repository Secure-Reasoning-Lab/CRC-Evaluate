# Cloud config: full AFC benchmark suite with given_fuzzer on GCE.
#
# Fleet: 1 orchestrator (n2d-standard-16)
#        6 workers (n2d-standard-224, 14 jobs × 16 cores each)
#        1 evaluator (n2d-standard-128, 8 jobs × 16 cores)
#
# Region layout:
#   us-central1: orchestrator + 4 workers (896 + 16 = 912 vCPUs, within 1000 quota)
#   us-south1:   2 workers + 1 evaluator (448 + 128 = 576 vCPUs, within 776 available)
#
# 3 trials × all AFC benchmarks, 16 cores per trial.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/afc-final-bugfinding/gce-atlantis-multilang-given_fuzzer-default-full-given-fuzzer-run.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: afc-bugfinding-given-fuzzer-run
  task: bugfinding
  benchmark_suite: afc-final
  sanitizers:
    - address
    - undefined
  mode: full
runtime:
  trials: 3
  max_total_time: 57600
  build_timeout: 14400
  run_timeout: 28800
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/afc-bugfinding-given-fuzzer-run
  report_filestore: /data/crsbench/report-data/afc-bugfinding-given-fuzzer-run
resources:
  cores_per_trial: 16
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 16
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 8
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: feat/gcp
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 1 TB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd — 14 concurrent jobs need disk
        gce-evaluator-n2d:
          machine_type: n2d-standard-128 # 128 vCPUs — 8 jobs × 16 cores
          boot_disk_size_gb: 2048        # 2 TB pd-ssd — holds Docker build cache
  orchestrator:
    region: us-central1
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
      count: 1
    placements:
      # us-central1: 4 workers × 224 = 896 vCPUs (+ 16 orch = 912, within 1000 quota)
      - region: us-central1
      - region: us-central1
      - region: us-central1
      - region: us-central1
      # us-south1: 2 workers × 224 = 448 vCPUs (within 776 available)
      - region: us-south1
      - region: us-south1
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
      count: 1
    placements:
      - region: us-south1 # 128 vCPUs (448 + 128 = 576, within 776 available)
