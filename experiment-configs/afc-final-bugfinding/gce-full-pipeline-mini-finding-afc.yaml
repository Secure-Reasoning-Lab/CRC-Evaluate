# AFC final bug-finding — full-pipeline phase 1 with mini models (production scale).
#
# 3 trials × all AFC benchmarks (excluding wireshark) × 3 CRSes:
#   crs-bug-finding-claude-code  (claude_code: claude-haiku-4-5)
#   crs-bug-finding-codex        (codex: gpt-5.4-mini)
#   crs-bug-finding-gemini-cli   (gemini_cli: gemini-3-flash-preview)
#
# (opencode is commented out — runs separately via gce-opencode-finding-afc.yaml.)
#
# Pair with: afc-final-bugfixing/gce-full-pipeline-mini-fixing-afc.yaml. That
# config consumes the POVs this run produces via inputs.pov.from_experiment_by_crs,
# matching each finding CRS to its corresponding fixing CRS.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment (opencode needs HF models)
#
# Usage:
#   CONFIG=experiment-configs/afc-final-bugfinding/gce-full-pipeline-mini-finding-afc.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: afc-full-pipeline-mini-finding
  task: bugfinding
  benchmark_suite: afc-final-no-wireshark
  sanitizers:
    - address
    - undefined
  mode: auto
runtime:
  trials: 3
  max_total_time: 76800
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 14400
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: false
  inc_build_enabled: false
  pov_early_stop: true
  skip_verification: true   # verification too slow for mini-models scale; collect raw PoVs only
  litellm:
    mode: external
    cost_budget: 30.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/afc-full-pipeline-mini-finding
  report_filestore: /data/crsbench/report-data/afc-full-pipeline-mini-finding
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  # crs-bug-finding-opencode:
  #   num_cores: 16
  #   budget_policy: terminate
  #   additional_env:
  #     CRS_AGENT: opencode
  #     OPENCODE_MODEL: zai-org/GLM-5.1
  crs-bug-finding-claude-code:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-haiku-4-5-20251001
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-bug-finding-codex:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: codex
      CODEX_MODEL: gpt-5.4-mini
      CODEX_CLI_VERSION: 0.121.0
  crs-bug-finding-gemini-cli:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: gemini_cli
      GEMINI_MODEL: gemini-3-flash-preview
      GEMINI_CLI_VERSION: 0.38.1
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
# skip_verification=true — no evaluator workload, fleet omitted below.
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {} # n2d-standard-16, 1 TB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-224 # 224 vCPUs — 14 jobs × 16 cores
          boot_disk_size_gb: 4096        # 4 TB pd-ssd — 14 concurrent jobs need disk
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
      - {}
      - {}
      - {} # 4 workers x 224 (3 CRSes × benchmarks; quota cap ~1055 vCPU, eval omitted)
