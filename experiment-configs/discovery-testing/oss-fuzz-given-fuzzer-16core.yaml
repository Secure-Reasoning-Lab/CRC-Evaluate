# Discovery-only experiment: run given_fuzzer on OSS-Fuzz projects without ground truth.
# Builds projects automatically and discovers fuzz targets on first run.
#
# Usage:
#   crsbench run --experiment-config experiment-configs/discovery-testing/oss-fuzz-given-fuzzer-16core.yaml
#
# Prerequisites:
#   - benchmarks_root points to an oss-fuzz projects/ directory
#   - oss_fuzz_path points to the oss-fuzz checkout (for auto-build)

experiment:
  name: discovery-given-fuzzer-16core
  mode: full
  benchmarks:
    - libyang
    - pcre2
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: /home/dongkwan/multilang-test/oss-fuzz/projects
oss_fuzz_path: /home/dongkwan/multilang-test/oss-fuzz

runtime:
  trials: 1
  max_total_time: 600
  build_timeout: 300
  run_timeout: 120
  verify_timeout: 60
  skip_verification: true
  skip_litellm: true

storage:
  experiment_filestore: /tmp/discovery-exp
  report_filestore: /tmp/discovery-report

crs_compose:
  atlantis-multilang-given_fuzzer:
    num_cores: 16

resources:
  cores_per_trial: 16
