# Discovery-only: given_fuzzer on OSS-Fuzz projects, 8 cores, 5 min run.
#
# Usage:
#   crsbench benchmark init --experiment-config experiment-configs/discovery-testing/oss-fuzz-given-fuzzer-8core-5min.yaml
#   crsbench run --experiment-config experiment-configs/discovery-testing/oss-fuzz-given-fuzzer-8core-5min.yaml

experiment:
  name: discovery-given-fuzzer-8core-5min
  mode: full
  benchmarks:
    - libyang
    - pcre2
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: /home/dongkwan/multilang-test/oss-fuzz/projects
oss_fuzz_path: /home/dongkwan/multilang-test/oss-fuzz

runtime:
  trials: 1
  max_total_time: 900
  build_timeout: 300
  run_timeout: 300
  verify_timeout: 60
  skip_verification: true
  skip_litellm: true

storage:
  experiment_filestore: /tmp/discovery-exp-8core-5min
  report_filestore: /tmp/discovery-report-8core-5min

crs_compose:
  atlantis-multilang-given_fuzzer:
    num_cores: 8

resources:
  cores_per_trial: 8
