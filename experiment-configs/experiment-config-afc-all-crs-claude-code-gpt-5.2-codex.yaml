# AFC All benchmarks with crs-claude-code pinned to GPT-5.2 Codex alias

experiment: afc-all-crs-claude-code-gpt-5-2-codex

trials: 1
mode: full
adapter: oss-crs

# Timeout profile: 4h build + 2h run + 4h verify (+1h buffer)
max_total_time: 39600
build_timeout: 14400
run_timeout: 7200
verify_timeout: 14400
per_pov_verify_timeout: 7200

# Bug-fixing input staging (1 POV variant per CPV)
max_pov_variants_per_cpv: 1

difficulty_level: 1

experiment_filestore: /home/dongkwan/crsbench_eval_patch/experiment-data
report_filestore: /home/dongkwan/crsbench_eval_patch/report-data

crses:
  - crs-claude-code

# All AFC C/C++ + JVM benchmarks
benchmark_suite: afc-all

# Distributed execution
redis_host: localhost

litellm_mode: external

llm_tracking_enabled: true

resources:
  cores_per_trial: 8
  litellm:
    max_concurrent_requests: 5
    cost_budget: 10

# Model override for crs-claude-code runtime
crs_overrides:
  crs-claude-code:
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: gpt-5.2-codex
      CLAUDE_CODE_SUBAGENT_MODEL: gpt-5.2-codex
      ANTHROPIC_DEFAULT_OPUS_MODEL: gpt-5.2-codex
      ANTHROPIC_DEFAULT_SONNET_MODEL: gpt-5.2-codex
      ANTHROPIC_DEFAULT_HAIKU_MODEL: gpt-5.2-codex

worker:
  # Reserve CPUs 112-127 for evaluator (16 cores total).
  # Worker uses CPUs 0-111: floor(112 / 8) = 14 parallel trial jobs.
  jobs: 14
  cores: "0-111"
  cleanup_after_trial: false
