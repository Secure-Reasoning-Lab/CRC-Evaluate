# Test Experiment Configuration for atlantis-multilang-given_fuzzer Integration Tests
#
# This is a minimal configuration for testing CRSBench with atlantis-multilang-given_fuzzer CRS.
# Designed for quick integration tests with multi-language fuzzing.

# Experiment identifier
experiment: "integration-test-multilang-given-fuzzer"

# Human-readable description
description: "Integration test configuration for atlantis-multilang-given_fuzzer CRS with minimal resources"

# Execution Configuration
trials: 1
max_total_time: 300  # 5 minutes for quick testing

# CRS Selection - using atlantis-multilang-given_fuzzer
crses:
  - atlantis-multilang-given_fuzzer

mode: delta # for quick testing
# Benchmark Selection - using simple sanity benchmark
benchmarks:
  - atlanta-nasm-delta-01
  # - sanity-mock-c-delta-01:
  #     - fuzz_process_input_header

# Difficulty Control
difficulty_level: 1

# Monitoring & Snapshots - more frequent for testing
snapshot_period: 60  # 1 minute

# Storage Configuration - temporary directories for testing
experiment_filestore: /tmp/crsbench-integration-test-multilang-given-fuzzer/experiment-data
report_filestore: /tmp/crsbench-integration-test-multilang-given-fuzzer/report-data

# LiteLLM Configuration - passthrough mode (default)
litellm_mode: passthrough

# CRS Paths - optional configuration (defaults: crses/registry, crses/configs)
# registry_dir: crses/registry
# crs_configs_dir: crses/configs

# Build Configuration
build_timeout: 600  # 10 minutes for building Docker images
run_timeout: 300    # 5 minutes for CRS execution (matches max_total_time)

# Hints Configuration - disabled for quick testing
hints_enabled: false

# Reproducibility
git_hash: null
