# Test Experiment Configuration for libFuzzer Integration Tests
#
# This is a minimal configuration for testing CRSBench with crs-libfuzzer CRS.
# Designed for quick integration tests with libfuzzer-based fuzzing.

# Experiment identifier
experiment: "integration-test-libfuzzer"

# Human-readable description
description: "Integration test configuration for libFuzzer CRS with minimal resources"

# Execution Configuration
trials: 1
max_total_time: 1800  # 30 minutes total (must be > build + run + verify timeouts)

# CRS Selection - using crs-libfuzzer
crses:
  - crs-libfuzzer

mode: delta # for quick testing
# Benchmark Selection - using atlanta benchmark
benchmarks:
  - atlanta-nasm-delta-01
  # - sanity-mock-c-delta-01:
  #     - fuzz_process_input_header

# Difficulty Control
difficulty_level: 1

# Monitoring & Snapshots - more frequent for testing
snapshot_period: 60  # 1 minute

# Storage Configuration - temporary directories for testing
experiment_filestore: /tmp/crsbench-integration-test-libfuzzer/experiment-data
report_filestore: /tmp/crsbench-integration-test-libfuzzer/report-data

# LiteLLM Configuration - passthrough mode (default)
litellm_mode: passthrough

# CRS Paths - optional configuration (defaults: crses/registry, crses/configs)
# registry_dir: crses/registry
# crs_configs_dir: crses/configs

# Build Configuration
build_timeout: 600   # 10 minutes for building Docker images
run_timeout: 300     # 5 minutes for CRS execution
verify_timeout: 300  # 5 minutes for POV verification

# Hints Configuration - disabled for quick testing
hints_enabled: false

# Reproducibility
git_hash: null
