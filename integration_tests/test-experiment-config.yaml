# Test Experiment Configuration for Integration Tests
#
# This is a minimal configuration for testing CRSBench functionality.
# Designed for quick integration tests with mock CRS and small benchmarks.

# Experiment identifier
experiment: "integration-test"

# Human-readable description
description: "Integration test configuration with minimal resources"

# Execution Configuration
trials: 1
max_total_time: 300  # 5 minutes for quick testing

# CRS Selection - using mock-crs for testing
crses:
  - mock-crs

# Benchmark Selection - using atlanta benchmark
# NOTE should have ground truth in mock-crs to make it work!!
benchmarks:
  - atlanta-nasm-delta-01

# Difficulty Control
difficulty_level: 1

# Monitoring & Snapshots - more frequent for testing
snapshot_period: 60  # 1 minute

# Storage Configuration - temporary directories for testing
experiment_filestore: /tmp/crsbench-integration-test/experiment-data
report_filestore: /tmp/crsbench-integration-test/report-data

# CRS Paths - optional configuration (defaults: crses/registry, crses/configs)
# registry_dir: crses/registry
# crs_configs_dir: crses/configs

# Reproducibility
git_hash: null
