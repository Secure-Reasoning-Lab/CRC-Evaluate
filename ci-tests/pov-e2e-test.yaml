# POV Verification E2E Test - CI configuration
#
# Used by GitHub Actions CI workflow (e2e-bugfinding job).
# Filestores are overridden at runtime with temp directories.
#
# Expected CPVs found:
#   - sanity-mock-c-delta-01: cpv_0 (fuzz_process_input_header), cpv_1 (fuzz_parse_buffer_section)
#   - sanity-mock-java-delta-01: cpv_0 (OssFuzz1)

experiment: pov-e2e-test

trials: 1
mode: delta
max_total_time: 1801   # >30 minutes (pov_early_stop terminates early)
build_timeout: 1200    # 20 minutes
run_timeout: 300       # 5 minutes
verify_timeout: 300    # 5 minutes
difficulty_level: 1

experiment_filestore: PLACEHOLDER_EXPERIMENT
report_filestore: PLACEHOLDER_REPORT

crses:
  - atlantis-multilang-given_fuzzer
benchmarks:
  - sanity-mock-c-delta-01
  - sanity-mock-java-delta-01

snapshot_period: 60
coverage_enabled: true
pov_early_stop: true
litellm_mode: null
