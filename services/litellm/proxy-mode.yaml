# LiteLLM proxy configuration that forwards requests to an OpenAI-compatible upstream endpoint.
# Required environment variables:
#   LITELLM_UPSTREAM_BASE_URL - URL of the upstream endpoint.
#   LITELLM_UPSTREAM_API_KEY - API key for the upstream endpoint.
#
# Usage:
#   docker run -d \
#     -p 4000:4000 \
#     -v $(pwd)/proxy-mode.yaml:/app/config.yaml:ro \
#     -e LITELLM_UPSTREAM_BASE_URL=http://central-litellm:4000 \
#     -e LITELLM_UPSTREAM_API_KEY=sk-your-key \
#     ghcr.io/berriai/litellm:main-stable \
#     --config /app/config.yaml

model_list:
  # The wildcard route forwards every requested model name to the upstream endpoint.
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: os.environ/LITELLM_UPSTREAM_BASE_URL
      api_key: os.environ/LITELLM_UPSTREAM_API_KEY

litellm_settings:
  json_logs: true
  log_responses: true
  store_model_in_db: false
  telemetry: false
  # Optional headers added to every upstream request.
  # default_headers:
  #   X-Proxy-Layer: "trial-litellm"
  #   X-Experiment-ID: "experiment-123"
