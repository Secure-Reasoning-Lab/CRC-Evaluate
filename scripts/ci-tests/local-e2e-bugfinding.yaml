experiment:
  name: pov-e2e-test
  task: bugfinding
  benchmarks:
  - sanity-mock-c-delta-01
  - sanity-mock-java-delta-01
  mode: delta
runtime:
  trials: 1
  max_total_time: 1801
  build_timeout: 1200
  run_timeout: 300
  verify_timeout: 300
  per_pov_verify_timeout: 300
  snapshot_period: 60
  coverage_enabled: false
  pov_early_stop: true
  litellm_mode: null
  llm_tracking_enabled: false
  inputs:
    pov:
      enabled: true
      max_variants_per_cpv: 1
storage:
  experiment_filestore: PLACEHOLDER_EXPERIMENT
  report_filestore: PLACEHOLDER_REPORT
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 2
resources:
  cores_per_trial: 2
  memory_per_trial: 8G
