# Local discovery smoke: opencode-clear bug-finding against OSS-Fuzz
# shortlist 2 (28 harnesses across 12 projects).
#
# This config uses an extracted OSS-Fuzz projects mirror under `.run/` so local
# `benchmark init` does not depend on sparse checkout state in
# `third_party/oss-fuzz/projects`.
#
# Prep the local shortlist mirror:
#   SHORTLIST_ROOT=.run/discovery-smoke-testing/oss-fuzz-shortlist2
#   rm -rf "$SHORTLIST_ROOT"
#   mkdir -p "$SHORTLIST_ROOT"
#   for p in duckdb mysql-server gstreamer libplist dng_sdk radare2 metadata-extractor zxing joni janino jflex rdf4j; do
#     git -C third_party/oss-fuzz archive --format=tar HEAD "projects/$p" | tar -xf - -C "$SHORTLIST_ROOT"
#   done
#
# Removed from the active shortlist after local validation on 2026-04-27:
#   - samba: build failed (`bootstrap.sh: not found`)
#   - mapserver: missing `build.sh` in the archived project tree
#   - espeak-ng: build failed (`./autogen.sh: No such file or directory`)
#   - dlplibs: build script emits too many fuzzers for the 28-harness target
#
# Note: the current `mysql-server` OSS-Fuzz build emits 23 router fuzzers; this
# shortlist keeps 4 of them so the aggregate harness count stays at 28.
#
# Usage:
#   CONFIG=experiment-configs/discovery-smoke-testing/opencode-clear-shortlist2-bugfinding.yaml
#   uv run crsbench benchmark init --experiment-config "$CONFIG" --jobs 6 --cpuset-cpus 0-47
#   uv run crsbench run --experiment-config "$CONFIG" --dry-run --local-only
#   uv run crsbench run --experiment-config "$CONFIG" --local-only

description: 'Local discovery smoke: opencode-clear bug-finding on OSS-Fuzz shortlist 2'

experiment:
  name: discovery-smoke-opencode-clear-shortlist2-bugfinding
  task: bugfinding
  mode: full
  benchmarks:
    - duckdb:
        - parse_fuzz_test
    - mysql-server:
        - routertest_fuzz_mysql_protocol_client_greeting
        - routertest_fuzz_mysql_protocol_query
        - routertest_fuzz_mysql_protocol_stmt_execute
        - routertest_fuzz_mysql_protocol_stmt_fetch
    - gstreamer:
        - gst-codec-utils
        - gst-discoverer
        - gst-subparse
        - gst-tag
        - typefind
    - libplist:
        - bplist_fuzzer
        - jplist_fuzzer
        - oplist_fuzzer
        - xplist_fuzzer
    - dng_sdk:
        - dng_camera_profile_fuzzer
        - dng_fixed_validate_fuzzer
        - dng_parser_fuzzer
        - dng_stage_fuzzer
        - dng_validate_fuzzer
    - radare2:
        - ia_fuzz
    - metadata-extractor:
        - ImageMetadataReaderFuzzer
    - zxing:
        - MultiFormatDecodeFuzzer
        - MultiFormatEncodeFuzzer
    - joni:
        - AddrListFixFuzzer
        - RegexMatcherFuzzer
    - janino:
        - ExpressionEvaluatorFuzzer
    - jflex:
        - JflexFuzzer
    - rdf4j:
        - ParserFuzzer
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: .run/discovery-smoke-testing/oss-fuzz-shortlist2/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 2460
  build_timeout: 1800
  run_timeout: 540
  verify_timeout: 60
  skip_verification: true
  source_mode: main_repo
  redis_host: localhost
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 0.5

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/discovery-smoke-testing/results/opencode-clear-shortlist2-bugfinding
  experiment_filestore: .run/discovery-smoke-testing/experiment-data/opencode-clear-shortlist2-bugfinding
  report_filestore: .run/discovery-smoke-testing/report-data/opencode-clear-shortlist2-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode-clear:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 8
  memory_per_trial: "32G"
