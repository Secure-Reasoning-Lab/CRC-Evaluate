# Discovery smoke: opencode bug-finding against OSS-Fuzz go-yaml (Go).
#
# This uses the vendored OSS-Fuzz checkout in third_party/ as both the helper
# checkout and the benchmark root. If the sparse checkout does not currently
# materialize go-yaml, restore it first:
#   git -C third_party/oss-fuzz restore --source=HEAD --worktree projects/go-yaml
#
# Usage:
#   CONFIG=experiment-configs/discovery-smoke-testing/opencode-go-yaml-bugfinding.yaml
#   uv run crsbench benchmark init --experiment-config "$CONFIG"
#   uv run crsbench run --experiment-config "$CONFIG" --local-only

description: 'Discovery smoke: opencode bug-finding on OSS-Fuzz go-yaml (Go)'

experiment:
  name: discovery-smoke-opencode-go-yaml
  task: bugfinding
  mode: full
  benchmarks:
    - go-yaml
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: third_party/oss-fuzz/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 2400
  build_timeout: 1800
  run_timeout: 300
  verify_timeout: 60
  skip_verification: true
  source_mode: main_repo
  redis_host: localhost
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 1.0

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/discovery-smoke-testing/results/opencode-go-yaml-bugfinding
  experiment_filestore: .run/discovery-smoke-testing/experiment-data/opencode-go-yaml-bugfinding
  report_filestore: .run/discovery-smoke-testing/report-data/opencode-go-yaml-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 8
  memory_per_trial: "32G"
