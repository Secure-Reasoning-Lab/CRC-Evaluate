# Local discovery smoke: opencode-clear bug-finding against OSS-Fuzz shortlist 3
# refill (28 harnesses across 8 projects).
#
# This config uses an extracted OSS-Fuzz projects mirror under `.run/` so local
# `benchmark init` does not depend on sparse checkout state in
# `third_party/oss-fuzz/projects`.
#
# Prep the local shortlist mirror:
#   SHORTLIST_ROOT=.run/discovery-smoke-testing/oss-fuzz-shortlist3
#   rm -rf "$SHORTLIST_ROOT"
#   mkdir -p "$SHORTLIST_ROOT"
#   for p in openssh libraw speex libical nghttp2 jsoncpp c-ares iperf; do
#     git -C third_party/oss-fuzz archive --format=tar HEAD "projects/$p" | tar -xf - -C "$SHORTLIST_ROOT"
#   done
#
# These projects are outside the existing CRSBench benchmark suites and outside
# the current shortlist 1-2 project set. Harness names come from current
# OSS-Fuzz `build.sh` outputs and should be validated locally with
# `crsbench benchmark init` before a GCE campaign.
#
# Usage:
#   CONFIG=experiment-configs/discovery-smoke-testing/opencode-clear-shortlist3-bugfinding.yaml
#   uv run crsbench benchmark init --experiment-config "$CONFIG" --jobs 4 --cpuset-cpus 0-31
#   uv run crsbench run --experiment-config "$CONFIG" --dry-run --local-only
#   uv run crsbench run --experiment-config "$CONFIG" --local-only

description: 'Local discovery smoke: opencode-clear bug-finding on OSS-Fuzz shortlist 3'

experiment:
  name: discovery-smoke-opencode-clear-shortlist3-bugfinding
  task: bugfinding
  mode: full
  benchmarks:
    - openssh:
        - pubkey_fuzz
        - privkey_fuzz
        - sig_fuzz
        - authopt_fuzz
        - sshsig_fuzz
        - sshsigopt_fuzz
        - kex_fuzz
        - agent_fuzz
    - libraw:
        - libraw_fuzzer
        - libraw_cr2_fuzzer
        - libraw_nef_fuzzer
        - libraw_raf_fuzzer
    - speex:
        - speex_encode_fuzzer_fixed
        - speex_encode_fuzzer_float
        - speex_decode_fuzzer_fixed
        - speex_decode_fuzzer_float
    - libical:
        - libical_fuzzer
        - libical_extended_fuzzer
        - libicalvcard_fuzzer
    - nghttp2:
        - nghttp2_fuzzer_frames
        - nghttp2_fuzzer
        - nghttp2_fuzzer_fdp
    - jsoncpp:
        - jsoncpp_fuzzer
        - jsoncpp_proto_fuzzer
    - c-ares:
        - ares_parse_reply_fuzzer
        - ares_create_query_fuzzer
    - iperf:
        - cjson_fuzzer
        - auth_fuzzer
  only_cpv_harnesses: false
  sanitizers:
    - address

benchmarks_root: .run/discovery-smoke-testing/oss-fuzz-shortlist3/projects
oss_fuzz_path: third_party/oss-fuzz

runtime:
  trials: 1
  max_total_time: 2460
  build_timeout: 1800
  run_timeout: 540
  verify_timeout: 60
  skip_verification: true
  source_mode: main_repo
  redis_host: localhost
  rts_enabled: false
  inc_build_enabled: false
  litellm:
    mode: external
    cost_budget: 0.5

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/discovery-smoke-testing/results/opencode-clear-shortlist3-bugfinding
  experiment_filestore: .run/discovery-smoke-testing/experiment-data/opencode-clear-shortlist3-bugfinding
  report_filestore: .run/discovery-smoke-testing/report-data/opencode-clear-shortlist3-bugfinding

crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-opencode-clear:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: opencode
      OPENCODE_MODEL: zai-org/GLM-5.1

resources:
  cores_per_trial: 8
  memory_per_trial: "32G"
