# Cloud config: v3-partial rerun of 5 partial JVM benchmarks.
#
# Fleet: 1 orchestrator (n2d-standard-16)
#        2 workers (n2d-standard-224, 14 jobs × 16 cores each)
#        1 evaluator (n2d-standard-128, 8 jobs × 16 cores)
#
# Scope: 5 benchmarks with incomplete trials in v2 (FD collateral or build timeout).
#   apache-commons-compress-full-01: 4 harnesses × 3 trials = 12 jobs
#   tika-delta-02, tika-delta-04, spring-framework, atlanta-tika-delta-01: 3 each = 12 jobs
#   Total: 24 trial-jobs, 1 wave on 28-slot fleet, ~10-12h wall-clock.
#
# Excludes (v3 failure showed FD-leak class):
#   - atlanta-jenkins-delta-01 (confirmed jazzer FD leak)
#   - atlanta-batik-delta-01, geonetwork, rdf4j, sqlite-jdbc, struts, tika-delta-03 (JVM FD class)
#   - atlanta-feign-full-01 (license-plugin JVM NPE), atlanta-kylin-delta-01 (TLS expired)
#   - atlanta-freetype2-delta-01 (pending separate Native rerun)
#
# Usage:
#   CONFIG=experiment-configs/crsbench-except-afc-final-bugfinding/gce-v3-rerun-given-fuzzer.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: non-afc-final-bf-given-fuzzer-v3-partial
  task: bugfinding
  benchmark_suite: crsbench-v3-rerun
  sanitizers:
    - address
  mode: full
runtime:
  trials: 3
  max_total_time: 64800
  build_timeout: 21600   # bumped from 14400 for struts/tika-delta-01
  run_timeout: 28800
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  redis_host: redis-server:6379
  source_mode: pkgs
  pov_early_stop: true
  litellm:
    skip: true
storage:
  experiment_filestore: /data/crsbench/experiment-data/non-afc-final-bf-given-fuzzer-v3-partial
  report_filestore: /data/crsbench/report-data/non-afc-final-bf-given-fuzzer-v3-partial
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  atlantis-multilang-given_fuzzer:
    num_cores: 16
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: false
evaluator:
  jobs: 8
  cores_per_job: 16
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: dongkwan
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-224
          boot_disk_size_gb: 2048
        gce-evaluator-n2d:
          machine_type: n2d-standard-128
          boot_disk_size_gb: 2048
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {} # worker 1
      - {} # worker 2
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
