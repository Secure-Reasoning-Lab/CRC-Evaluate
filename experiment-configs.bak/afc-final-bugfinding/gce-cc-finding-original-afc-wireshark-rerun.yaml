# Targeted rerun for the AFC Wireshark Claude Code trials with zero LLM usage
# and the same early CRS initialization failure pattern, 16 cores per trial.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/afc-final-bugfinding/gce-cc-finding-original-afc-wireshark-rerun.yaml
#   SELECTOR=experiment-configs/afc-final-bugfinding/afc-cc-finding-original-wireshark-trial-keys.txt
#   uv run crsbench cloud launch --config "$CONFIG" --only-trial-keys-file "$SELECTOR"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: afc-cc-finding-original-wireshark-rerun
  task: bugfinding
  mode: auto
  benchmarks:
    - afc-wireshark-delta-01: [handler_ber]
    - afc-wireshark-delta-02: [handler_icmp]
    - afc-wireshark-delta-03: [handler_irc]
    - afc-wireshark-delta-04: [handler_json]
    - afc-wireshark-delta-05: [handler_netbios]
    - afc-wireshark-delta-07: [handler_gvcp]
    - afc-wireshark-full-01: [handler_aim, handler_bat.vis, handler_netbios, handler_openvpn.udp, handler_telnet, handler_zbee_zdp]
  sanitizers:
    - address
runtime:
  trials: 3
  max_total_time: 64800
  build_timeout: 21600
  run_timeout: 28800
  verify_timeout: 7200
  per_pov_verify_timeout: 300
  skip_verification: true
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: false
  inc_build_enabled: false
  pov_early_stop: true
  litellm:
    mode: external
    cost_budget: 30.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/afc-cc-finding-original-wireshark-rerun
  report_filestore: /data/crsbench/report-data/afc-cc-finding-original-wireshark-rerun
resources:
  cores_per_trial: 16
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-claude-code:
    num_cores: 16
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
worker:
  jobs: 14
  cores_per_job: 16
  storage:
    cleanup_after_trial: true
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - asia-south1
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 1024
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {}
        gce-worker-n2d:
          machine_type: n2d-standard-224
          boot_disk_size_gb: 4096
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {}
      - {}
      - {} # 3 workers, each 14 x 16-core slots on n2d-standard-224
