# CRSBench experiment configuration
# Generated by: crsbench gen-config
#
# Reference: docs/experiment-config-distributed-example.yaml
# Validate with: crsbench gen-config --validate --output <file>

description: 'Smoke test: smoke-bug-fixing-old-model'

experiment:
  name: smoke-bug-fixing-old-model
  task: bugfixing
  mode: auto
  benchmarks:
  - afc-curl-delta-05:
      curl_fuzzer_dict: [cpv_0]
  - afc-libexif-delta-03:
      exif_from_data_fuzzer: [cpv_0]
  - afc-libxml2-delta-03:
      html: [cpv_0]
  - afc-mongoose-delta-02:
      fuzz: [cpv_0]
  - afc-apache-poi-full-01:
      POIPOIFSDumpFuzzer: [cpv_2]
  - afc-log4j2-delta-01:
      SimpleLoggerFuzzer: [cpv_0]
  - afc-pdfbox-delta-01:
      PDFOCRFuzzer: [cpv_0]
  - afc-tika-delta-01:
      HtmlParserFuzzer: [cpv_0]

# Per-CRS resource allocation. Adjust num_cores/mem_limit per CRS.
# Additional options: mem_limit, additional_env
crs_compose:
  crs-claude-code-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-5-20251101
      CLAUDE_CODE_CLI_VERSION: 2.1.92
  crs-codex-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: codex
      CODEX_MODEL: gpt-5-codex
      CODEX_CLI_VERSION: 0.121.0
  crs-gemini-cli-old-model:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: gemini_cli
      GEMINI_MODEL: gemini-2.5-pro
      GEMINI_CLI_VERSION: 0.38.1

# Runtime settings. For distributed mode, add redis_host.
# Additional options: per_pov_verify_timeout, snapshot_period,
#   pov_early_stop, litellm, inputs (pov/sarif/seed/diff)
runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: 1
  litellm:
    mode: external
    cost_budget: 2.0

# Storage paths. For distributed mode, consider shared mount points.
# Additional options: keep_only_results, cleanup_after_trial,
#   copy_results_after_trial, results_filestore
storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/smoke-testing/results/smoke-bug-fixing-old-model
  experiment_filestore: .run/smoke-testing/experiment-data/smoke-bug-fixing-old-model
  report_filestore: .run/smoke-testing/report-data/smoke-bug-fixing-old-model

# Worker settings — parallel trial execution capacity.
# Additional options: continuous, worker_name, minimum_disk_size
worker:
  jobs: 10
  cores_per_job: 8

# Evaluator settings — parallel POV build/verify capacity.
# Additional options: idle_timeout, build_jobs, verify_jobs
evaluator:
  jobs: 2
  cores_per_job: 4

resources:
  memory_per_trial: "64G"
