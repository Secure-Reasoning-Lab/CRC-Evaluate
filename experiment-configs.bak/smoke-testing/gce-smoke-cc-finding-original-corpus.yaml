# Smoke test on GCE: Claude Code (opus-4-6), 1 trial x smoke-cc-finding subset with seed corpus enabled.
#
# Prerequisites:
#   1. gcloud auth login && gcloud auth application-default login
#   2. uv run crsbench cloud keygen (add public key to GitHub deploy keys)
#   3. HF_TOKEN in .env or environment
#
# Usage:
#   CONFIG=experiment-configs/smoke-testing/gce-smoke-cc-finding-original-corpus.yaml
#   uv run crsbench cloud launch --config "$CONFIG"
#   uv run crsbench cloud --config "$CONFIG" monitor
#   uv run crsbench cloud --config "$CONFIG" collect --force
#   uv run crsbench cloud --config "$CONFIG" teardown --force

experiment:
  name: gce-smoke-cc-finding-original-corpus
  task: bugfinding
  mode: auto
  benchmarks:
    - afc-curl-delta-05: [curl_fuzzer_dict]
    - afc-libexif-delta-03: [exif_from_data_fuzzer]
    - afc-libxml2-delta-03: [html]
    - afc-mongoose-delta-02: [fuzz]
    - afc-apache-poi-full-01: [POIPOIFSDumpFuzzer]
    - afc-log4j2-delta-01: [SimpleLoggerFuzzer]
    - afc-pdfbox-delta-01: [PDFOCRFuzzer]
    - afc-tika-delta-01: [HtmlParserFuzzer]
  sanitizers:
    - address
    - undefined
runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 3600
  per_pov_verify_timeout: 120
  redis_host: redis-server:6379
  source_mode: pkgs
  rts_enabled: true
  inc_build_enabled: true
  pov_early_stop: true
  inputs:
    seed: {}
  litellm:
    mode: external
    cost_budget: 5.0
storage:
  experiment_filestore: /data/crsbench/experiment-data/gce-smoke-cc-finding-original-corpus
  report_filestore: /data/crsbench/report-data/gce-smoke-cc-finding-original-corpus
resources:
  cores_per_trial: 8
  memory_per_trial: "64G"
crs_compose:
  oss_crs_infra:
    shared: true
  crs-bug-finding-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92
worker:
  jobs: 8
  cores_per_job: 8
  storage:
    cleanup_after_trial: true
evaluator:
  jobs: 4
  cores_per_job: 4
cloud:
  remote:
    experiment_root: /data/crsbench/experiment-data
  defaults:
    readiness_timeout_sec: 1200
    crsbench_install_spec: "git+ssh://git@github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
    github_deploy_key_path: .crsbench-keys/crsbench-deploy
  env:
    HF_TOKEN: os.environ/HF_TOKEN
    CRSBENCH_LLM_UPSTREAM_BASE_URL: os.environ/CRSBENCH_LLM_UPSTREAM_BASE_URL
    CRSBENCH_LLM_UPSTREAM_MASTER_KEY: os.environ/CRSBENCH_LLM_UPSTREAM_MASTER_KEY
    CRSBENCH_NOTIFY_APPRISE_URLS: os.environ/CRSBENCH_NOTIFY_APPRISE_URLS
  bootstrap:
    prepare_mode: full
    download_benchmarks: auto
  providers:
    gce:
      project: aixcc-426805
      ssh_via_iap: true
      regions:
        - us-central1
        - us-south1
        - us-east5
        - us-east1
      fallback: true
      profile_defaults:
        machine_type: n2d-standard-16
        boot_disk_size_gb: 512
        boot_disk_type: pd-ssd
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: 153298433405-compute@developer.gserviceaccount.com
        owner_label: crsbench
      instance_profiles:
        gce-orchestrator-n2d: {}         # n2d-standard-16, 512 GB pd-ssd
        gce-worker-n2d:
          machine_type: n2d-standard-64  # 64 vCPUs -- 8 jobs x 8 cores
          boot_disk_size_gb: 1024        # 1 TB pd-ssd
        gce-evaluator-n2d:
          machine_type: n2d-standard-16  # 16 vCPUs -- 4 jobs x 4 cores
          boot_disk_size_gb: 512         # 512 GB pd-ssd -- Docker build cache
  orchestrator:
    instance_profile: gce-orchestrator-n2d
  workers:
    defaults:
      instance_profile: gce-worker-n2d
    placements:
      - {} # 1 worker
  evaluators:
    defaults:
      instance_profile: gce-evaluator-n2d
    placements:
      - {} # evaluator 1
      - {} # evaluator 2
