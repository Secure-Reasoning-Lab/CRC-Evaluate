description: 'Smoke test: Claude Code bug-fixing seeded from a prior bug-finding run (.run/cc-finding)'
#
# Pipeline: consumes POVs discovered by the bug-finding run stored under
# ``.run/cc-finding`` and feeds them as bug-fixing inputs. CPVs that the
# bug-finding CRS did not discover are skipped automatically by the trial
# matrix, so no ground-truth POVs leak into the fix run.
#
# Prerequisites:
# - ``.run/cc-finding/<benchmark>/<harness>/<mode>/address/trial-*/povs/pov_store.json``
#   must exist (produced by smoke-cc-finding-original or equivalent).
# - Local Redis running for distributed queue (``redis_host: localhost``).
# - Benchmarks listed below must be prepared under ``benchmarks/``.

experiment:
  name: smoke-cc-fixing-from-cc-finding
  task: bugfixing
  mode: auto
  benchmarks:
  # Benchmarks below are the subset of cc-finding where at least one CPV was
  # discovered. CPV selection is handled automatically — trials are scheduled
  # only for CPVs present in the source experiment.
  - afc-curl-delta-02: [curl_fuzzer_ws]
  - afc-shadowsocks-full-01: [json_fuzz]
  - afc-pdfbox-full-01: [DomXmpParserFuzzer]
  - afc-lcms-full-01: [cms_virtual_profile_fuzzer]

crs_compose:
  crs-claude-code:
    num_cores: 8
    budget_policy: terminate
    additional_env:
      CRS_AGENT: claude_code
      ANTHROPIC_MODEL: claude-opus-4-6
      CLAUDE_CODE_CLI_VERSION: 2.1.92

runtime:
  trials: 1
  max_total_time: 10800
  build_timeout: 4800
  run_timeout: 1200
  verify_timeout: 600
  per_pov_verify_timeout: 120
  redis_host: localhost
  rts_enabled: true
  inc_build_enabled: true
  inputs:
    pov:
      max_variants_per_cpv: null
      # Points at the prior bug-finding experiment store. When set, CPVs
      # absent from this directory are skipped at trial generation and POVs
      # are deduplicated by crash signature before staging.
      from_experiment: .run/cc-finding
  litellm:
    mode: external
    cost_budget: 5.0

storage:
  copy_results_after_trial: true
  cleanup_after_trial: true
  results_filestore: .run/smoke-testing/results/smoke-cc-fixing-from-cc-finding
  experiment_filestore: .run/smoke-testing/experiment-data/smoke-cc-fixing-from-cc-finding
  report_filestore: .run/smoke-testing/report-data/smoke-cc-fixing-from-cc-finding

worker:
  jobs: 3
  cores_per_job: 8
evaluator:
  jobs: 1
  cores_per_job: 4
resources:
  memory_per_trial: "64G"
