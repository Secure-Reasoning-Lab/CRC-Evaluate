SPECIFICATION HealthySpec
CHECK_DEADLOCK FALSE

CONSTANTS
    Jobs = {j1}
    MaxRetries = 2
    BuggyRequeueEnabled = FALSE

INVARIANT TypeInvariant
INVARIANT QueuedMeansExecutable
INVARIANT TerminalStatesConsistent
INVARIANT NoStalledTimedOutJob
INVARIANT NoDuplicateActiveOwner
INVARIANT RetryCountMatchesRequeues

PROPERTY EventuallyCompletedOrFailed
PROPERTY TerminalJobsNeverResurrect
PROPERTY ArtifactTerminalStateMatchesLifecycle
PROPERTY ResumeReconciliationIsComplete
PROPERTY HealthyWorkerCannotBeOrphaned
