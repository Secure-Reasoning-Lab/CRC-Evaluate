# =============================================================================
# CRSBench Distributed Experiment Configuration Example
# =============================================================================
# Comprehensive example showing all configuration options for distributed
# execution. Copy and modify for your experiment.

# Unique identifier for this experiment run.
experiment: my-distributed-exp

# Number of trials per benchmark-CRS pair. (>= 1)
trials: 3

# Evaluation mode for benchmark execution.
# Possible values: "delta" | "full" | "all"
# "all" means evaluating both delta-mode and full-mode challenges
mode: delta

# CRS adapter type. Only supported value: "oss-crs" (mode auto-detected from CRS registry).
adapter: oss-crs

# Maximum time in seconds per trial. Must be > build + run + verify timeouts.
max_total_time: 28800  # 8 hours

# Maximum time in seconds for CRS build phase.
build_timeout: 3600  # 1 hour, default: 3600

# Maximum time in seconds for CRS run phase.
run_timeout: 14400  # 4 hours, default: 7200

# Maximum time in seconds for POV/patch verification phase.
verify_timeout: 7200  # 2 hours, default: 7200

# Difficulty level controlling assistance. (0-4)
difficulty_level: 1

# Directory path for experiment data storage.
experiment_filestore: /data/crsbench/experiments

# Directory path for HTML reports and summary data.
report_filestore: /data/crsbench/reports

# =============================================================================
# Cleanup Configuration
# =============================================================================

# Delete bulky artifacts after experiment completes, keeping only essential files.
# Essential files include: metadata.json, snapshots, status markers, output/, input directories.
# Uses whitelist approach - everything not in whitelist is deleted.
# Default: false
keep_only_results: false

# Delete bulky artifacts after each trial completes (more aggressive cleanup).
# Useful for long experiments with many trials to save disk space during execution.
# Default: false
cleanup_after_trial: false

# Copy essential files to results_filestore after each trial completes.
# Requires results_filestore to be set.
# Copying happens immediately after trial ends and BEFORE cleanup.
# Useful for preserving results when cleanup_after_trial=true or when workers may be interrupted.
# Default: false
copy_results_after_trial: false

# Destination path for copying results (contains experiment-data/ and report-data/).
# Used by copy_results_after_trial.
# Dashboard-compatible structure: results_filestore/{folder_name}/experiment-data/ and report-data/
# results_filestore: /opt/crsbench-finished/my-experiment

# List of CRS implementations to evaluate.
# This profile is single-CRS: exactly one CRS entry is allowed.
# Use separate experiments for different CRS setups.
crses:
  - atlantis-c

# Optional compose/runtime overrides for oss-crs adapter.
# crs_compose:
#   docker_registry: us-central1-docker.pkg.dev/aixcc-scoring-prod/oss-fuzz
#   # Global LiteLLM config override for this experiment
#   litellm_config_path: /path/to/combined-litellm-config.yaml
#
# Optional per-CRS overrides keyed by CRS name in `crses`.
# Highest precedence for litellm_config_path is:
#   crs_overrides.<crs>.litellm_config_path >
#   crs_compose.litellm_config_path >
#   crses/configs/<crs>/config-litellm.yaml
# crs_overrides:
#   atlantis-c:
#     litellm_config_path: /path/to/atlantis-c-litellm.yaml
#     additional_env:
#       ANTHROPIC_MODEL: claude-sonnet-4-5-20250929

# =============================================================================
# Benchmark Specification (choose ONE of the following)
# =============================================================================

# Option A: Inline benchmark list.
# Each entry can be a string (all harnesses) or dict (specific harnesses).
benchmarks:
  - libjpeg-turbo                    # all harnesses
  - libxml2
  - curl:                            # specific harnesses only
      - curl_fuzzer
      - curl_fuzzer_http

# Option B: Load from benchmark suite file.
# Mutually exclusive with 'benchmarks'.
# benchmark_suite: core-c            # loads benchmark-suites/core-c.yaml

# Root directory containing benchmark projects.
# benchmarks_root: ./benchmarks      # default: ./benchmarks

# Root directory containing benchmark suite YAML files.
# benchmark_suites_root: ./benchmark-suites  # default: ./benchmark-suites

# =============================================================================
# Distributed Execution
# =============================================================================

# Redis server hostname for distributed mode.
# Possible values: null | "none" | "localhost" | "localhost:6380" | "redis" | "<ip>" | "<hostname>" | "<hostname>:<port>"
# - null or "none": local mode (sequential, no Redis)
# - "localhost" or "localhost:6379": Redis on same machine
# - "redis": Docker Compose service name
# - "<ip>/<hostname>[:port]": remote Redis server
redis_host: localhost:6379

# Snapshot interval in seconds. (0 to disable, 60-86400 when enabled)
snapshot_period: 900  # 15 minutes, default: 900

# =============================================================================
# Resource Allocation
# =============================================================================
resources:
  # CPU cores allocated per trial. (>= 1)
  cores_per_trial: 8  # default: 4

  # Memory limit per trial in Docker format.
  # Possible values: "4G" | "8G" | "16G" | "32G" | "64G"
  memory_per_trial: "16G"  # default: "8G"

  # LiteLLM configuration for LLM-based CRS.
  litellm:
    # Maximum concurrent LLM API requests. (>= 1)
    max_concurrent_requests: 50  # default: 10

    # Cost budget in USD. (>= 0)
    cost_budget: 500.0  # default: 100.0

    # Team name for grouping API keys in LiteLLM.
    # If not set, uses experiment name as team name.
    # Useful for organizing API keys by project or research group.
    # team: "crsbench"  # default: uses experiment name

    # Maximum budget in USD for the entire team. (>= 0)
    # Sets a spending cap for all API keys in the team combined.
    # Useful for controlling total costs across multiple trials in the same experiment.
    # team_max_budget: 500.0  # default: null (no team-level budget limit)

# =============================================================================
# Worker Configuration
# =============================================================================
worker:
  # Number of parallel jobs per worker process. (>= 1)
  jobs: 4  # default: 4

  # Redis server for workers (host or host:port).
  redis_host: localhost:6379  # default: top-level redis_host

  # Run continuously or exit when queue is empty.
  continuous: true  # default: false

  # Minimum free disk space required to accept new jobs.
  # Possible values: "200GB" | "100MB" | "1TB" | etc.
  minimum_disk_size: "10GB"  # default: "10GB"

  # Interval (seconds) between disk space checks when paused.
  disk_check_interval: 60  # default: 60

  # ---------------------------------------------------------------------------
  # Path Overrides (optional)
  # Use when workers have different filesystem layouts than orchestrator.
  # ---------------------------------------------------------------------------

  # Override experiment data storage path.
  # experiment_filestore: /mnt/nfs/experiments

  # Override report storage path.
  # report_filestore: /mnt/nfs/reports

  # Override oss-fuzz installation path.
  # oss_fuzz_path: /opt/oss-fuzz

  # Override CRS registry directory.
  # registry_dir: /opt/oss-crs/registry

  # Override CRS configs directory.
  # crs_configs_dir: /opt/crses/configs

  # Override number of parallel build workers.
  # build_workers: 4

  # Override number of parallel verification workers.
  # verify_workers: 4

  # Override benchmarks root directory.
  # benchmarks_root: /opt/benchmarks

  # Override benchmark suites root directory.
  # benchmark_suites_root: /opt/benchmark-suites

  # ---------------------------------------------------------------------------
  # Cleanup Configuration Overrides (optional)
  # Use when workers need different cleanup behavior than orchestrator.
  # ---------------------------------------------------------------------------

  # Override cleanup after experiment completion.
  # keep_only_results: true

  # Override cleanup after each trial.
  # cleanup_after_trial: true

  # Override per-trial result copying.
  # copy_results_after_trial: true

  # Override results destination path (contains experiment-data/ and report-data/).
  # results_filestore: /mnt/nfs/finished-experiments

# =============================================================================
# Optional Features
# =============================================================================

# Path to oss-fuzz directory.
oss_fuzz_path: ./oss-fuzz  # default: ./oss-fuzz

# Path to CRS registry directory.
# registry_dir: ./oss-crs/registry  # default: ./oss-crs/registry

# Path to CRS configs directory.
# crs_configs_dir: ./crses/configs  # default: ./crses/configs

# Enable hints for CRS evaluation.
hints_enabled: false  # default: false

# SARIF hint level. (1=vague, 5=detailed, null=disabled)
# hint_sarif_level: 3

# Pre-fuzz corpus level. (1=minimal, 5=comprehensive, null=disabled)
# hint_corpus_level: null  # PLACEHOLDER - not yet implemented

# LiteLLM mode.
# Possible values: "passthrough" | "proxy"
# passthrough: external LiteLLM-first runtime
# - uses CRSBENCH_LLM_UPSTREAM_BASE_URL (preferred passthrough target) or CRSBENCH_LLM_BASE_URL
# - requires CRSBENCH_LLM_API_KEY or CRSBENCH_LLM_MASTER_KEY
# proxy: trial-local LiteLLM hop
# - uses CRSBENCH_LLM_BASE_URL (immediate target)
# - requires CRSBENCH_LLM_MASTER_KEY
litellm_mode: passthrough  # default: passthrough

# Enable LLM usage tracking via LiteLLM Virtual Keys.
# Requires CRSBENCH_LLM_* env vars for the selected mode.
llm_tracking_enabled: true  # default: true

# Docker image prefix for custom project images.
project_image_prefix: aixcc-afc  # default: aixcc-afc

# Skip POV verification after CRS execution.
skip_verification: false  # default: false

# Enable coverage collection during trials.
coverage_enabled: false  # default: false

# Time in seconds without new coverage before saturation.
coverage_saturation_time: 21600  # 6 hours, default: 21600

# Terminate trial early when coverage saturation is detected. (NOT YET IMPLEMENTED)
coverage_early_stop: false  # default: false

# Terminate trial early when all CPVs for harness are found.
pov_early_stop: false  # default: false

# POV deduplication strategy before verification/reporting.
# Possible values: "patch-based" | "stack-based" | "status-based" | "none"
pov_dedup_strategy: patch-based  # default: patch-based

# Number of parallel workers for building variants. (>= 1)
# build_workers: 4  # default: 4

# Number of parallel workers for POV/patch verification. (>= 1)
# verify_workers: 4  # default: 4

# Skip harnesses without CPVs for bug-finding CRS.
only_cpv_harnesses: true  # default: true
