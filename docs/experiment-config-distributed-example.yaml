# CRSBench distributed config (source-of-truth, grouped contract).
# Primary grouped contract:
# - experiment: identity + benchmark selectors
# - runtime: trial matrix + execution timing + queue endpoint
# - storage: experiment/report/result roots + cleanup policy
# - resources: global compute defaults/tags (fallback for per-CRS runtime sizing)
# - worker/evaluator: distributed process behavior and capacity profile

experiment:
  name: my-distributed-exp
  task: bugfixing
  mode: delta
  # Optional (default: true): skip harnesses with no CPVs.
  # only_cpv_harnesses: true
  benchmark_suite: afc/final
  # Use exactly one of benchmark_suite or benchmarks.
  # benchmarks:
  #   - libjpeg-turbo                 # all harnesses
  #   - curl:                         # selected harnesses
  #       - curl_fuzzer
  #       - curl_fuzzer_http
  #   - afc-libxml2-delta-02:         # selected CPVs per harness
  #       xml:
  #         - cpv_0
  #         - cpv_1
  sanitizers: [address, undefined]

crs_compose:
  # Optional: path to oss-crs executable (default: "oss-crs" on PATH).
  # oss_crs_cmd: oss-crs
  # Optional infra allocation override.
  # If omitted, CRSBench behaves as:
  #   oss_crs_infra:
  #     shared: true
  # oss_crs_infra:
  #   # Choose exactly one:
  #   # 1) shared=true (use union of CRS service cpusets), or
  #   # 2) num_cores=<N> (dedicated infra cores)
  #   shared: true
  #   # num_cores: 8
  crs-codex:
    # CRS source is resolved from oss-crs registry entry by default:
    #   oss-crs/registry/crs-codex.yaml
    # Typical registry entry fields:
    #   source:
    #     url: <git-url>
    #     ref: <git-ref>
    #   # or
    #   source:
    #     local_path: <existing-local-checkout>
    num_cores: 8
    # Optional per-CRS memory limit (e.g., 8G, 16384m).
    # mem_limit: "16G"
    # Optional per-CRS environment overrides passed to oss-crs service.
    # additional_env:
    #   OPENAI_DEFAULT_MODEL: gpt-5.4
    #   OPENAI_REASONING_EFFORT: high
    # Optional per-CRS behavior when the trial LLM budget
    # (runtime.litellm.cost_budget) is exceeded.
    #   continue (default): keep the CRS running; LiteLLM has revoked the key
    #     so no further cost accrues
    #   terminate: stop the CRS early and persist a budget-exceeded.json record
    # Detection piggybacks on runtime.snapshot_period, so termination may be
    # delayed by up to one snapshot cycle. Requires runtime.litellm.cost_budget
    # to be set; without it this knob is inert.
    # budget_policy: continue

runtime:
  trials: 3
  # Canonical grouped redis host.
  # If both top-level redis_host and runtime redis host are provided,
  # grouped runtime value takes precedence.
  redis_host: localhost:6379
  max_total_time: 28800
  build_timeout: 3600
  run_timeout: 14400
  verify_timeout: 7200
  # Per-POV verify timeout inside the verify phase.
  per_pov_verify_timeout: 180
  # Optional POV deduplication strategy before reporting/verification fan-out.
  # Example values: patch-based, stack-based, status-based, none
  # pov_dedup_strategy: patch-based
  # Stop trial early when all CPVs for a harness are confirmed.
  pov_early_stop: false
  # LiteLLM wiring (usually external proxy in production).
  litellm:
    mode: external
    tracking_enabled: true
    # Optional per-trial default budget for LiteLLM key generation/accounting.
    cost_budget: 10.0
  # Wait time after run-end before final LLM usage settlement/log capture.
  # Helps LiteLLM spend/log aggregates converge. Set 0 to disable.
  # llm_accounting_settle_seconds: 60
  # Optional: include all POV variants during patch verification.
  # patch_verify_variants: false
  # Optional source provenance mode.
  # pkgs (recommended): use benchmark-bundled tarballs from pkgs/.
  # main_repo (advanced): clone upstream repository directly.
  # source_mode: pkgs
  # Optional snapshot cadence in seconds (0 disables periodic snapshots).
  snapshot_period: 300
  # Optional: skip verification phase (debug/throughput only).
  # skip_verification: false
  # Optional: skip LiteLLM deployment and force litellm mode/tracking off.
  # Preferred grouped key:
  # litellm:
  #   skip: true
  # (top-level/runtime skip_litellm is still accepted for compatibility)
  # Optional top-level incremental-image settings.
  # These keys live at experiment-config top level, not under runtime.
  # Prepare order:
  #   local image -> remote pull -> local build fallback
  # Policy meanings:
  #   auto: local -> pull -> local build fallback
  #   pull_only: local -> pull only
  #   build_only: local -> local build only
  # Size gate:
  #   max_pull_bytes skips pull only when the known remote image size exceeds
  #   the cap
  # Timeout:
  #   pull_timeout_sec bounds docker pull
  # Top-level example:
  # inc_image_policy: auto
  # inc_image_registry: ghcr.io/team-atlanta/crsbench
  # inc_image_max_pull_bytes: 1073741824  # 1 GiB
  # inc_image_pull_timeout_sec: 900
  inputs:
    # runtime.inputs apply to both bugfinding and bugfixing runs.
    # Presence means enabled.
    pov:
      # Provide one POV variant per CPV.
      max_variants_per_cpv: 1
    # Optional inputs:
    # SARIF bug-candidate hints (level 1..5, higher = more detailed).
    # sarif:
    #   level: 3
    # Seed corpus input from imported seeds; max_time is relative-age window (seconds).
    # seed:
    #   max_time: 3600
    # Diff guidance input.
    # diff: true
  # Compatibility guide for older flat configs:
  # - litellm_mode -> runtime.litellm.mode
  # - llm_tracking_enabled -> runtime.litellm.tracking_enabled
  # - seed_corpus_enabled / seed_corpus_max_time -> runtime.inputs.seed
  # - hints_enabled / hint_sarif_level -> runtime.inputs.sarif
  # - top-level trials/timeouts -> runtime.*

storage:
  experiment_filestore: /data/crsbench/experiments
  report_filestore: /data/crsbench/reports
  keep_only_results: false
  cleanup_after_trial: false
  # When true, trial outputs are copied to results_filestore.
  copy_results_after_trial: false
  # Used only when copy_results_after_trial=true.
  # results_filestore: /data/crsbench/finished

cloud:
  remote:
    experiment_root: /data/crsbench/experiments
  defaults:
    readiness_timeout_sec: 900
    crsbench_install_spec: "git+https://github.com/sslab-gatech/CRSBench.git"
    crsbench_git_ref: main
  providers:
    gce:
      project: example-project
      ssh_via_iap: true
      profile_defaults:
        machine_type: e2-standard-16
        boot_disk_size_gb: 200
        # boot_disk_type: pd-ssd  # GCE disk type (pd-ssd, pd-balanced, pd-standard)
        image: projects/ubuntu-os-cloud/global/images/family/ubuntu-2404-lts-amd64
        service_account_email: crsbench@example-project.iam.gserviceaccount.com
        owner_label: team-crs
      instance_profiles:
        gce-orch:
          service_account_email: crsbench-orchestrator@example-project.iam.gserviceaccount.com
        gce-work:
          service_account_email: crsbench-worker@example-project.iam.gserviceaccount.com
  orchestrator:
    zone: us-central1-a
    instance_profile: gce-orch
  workers:
    defaults:
      instance_profile: gce-work
      count: 4
    placements:
      - zone: us-central1-a

# Optional top-level verification/reporting behavior.
# pov_dedup_strategy: patch-based

# Optional global compute defaults/tags:
# - cores_per_trial/memory_per_trial are fallback defaults when a CRS service
#   does not set num_cores/mem_limit.
# - When both crs_compose and resources omit a CPU/memory limit, CRSBench
#   treats that as unconstrained and materializes the full visible runtime
#   CPU affinity / memory envelope for oss-crs.
# - cpu_tag is matched by worker/evaluator cpu_tag in distributed scheduling.
# Precedence for CRS runtime CPU/memory:
#   crs_compose.<crs>.num_cores/mem_limit
#   > resources.cores_per_trial/memory_per_trial
#   > current visible runtime envelope (when both are omitted)
# resources:
#   cores_per_trial: 8
#   memory_per_trial: "16G"
#   # Optional job capability tag (matched by worker/evaluator cpu_tag).
#   cpu_tag: amd-epyc

worker:
  # Optional. When omitted, CRSBench runs one worker job and lets that job
  # use the visible runtime CPU envelope unless narrower limits are configured.
  jobs: 4
  # Optional. When omitted, CRSBench materializes per-job CPUs from the
  # current visible runtime CPU envelope instead of using a hidden fallback.
  cores_per_job: 8
  # continuous defaults to true; set false only for one-shot drain-and-exit runs.
  # continuous: true
  # Optional stable worker identifier in logs/metadata.
  # worker_name: worker-a
  # CPU placement is controlled by worker CLI:
  #   crsbench worker --cpuset ... --skip-cpuset ...
  # (not configured in experiment YAML).
  # Optional worker capability tag for matching cpu_tag jobs.
  # cpu_tag: amd-epyc
  # redis_host: localhost:6379  # defaults to runtime.redis_host
  # Optional heterogeneous-worker benchmark path override.
  # benchmarks_root: /mnt/shared/benchmarks
  minimum_disk_size: "10GB"
  disk_check_interval: 60
  # Optional machine-local overrides for storage/cleanup.
  # Use only when this worker machine must diverge from top-level storage.
  # Unset keys inherit from top-level `storage`.
  # storage:
  #   # Example: only override destination for copied final results.
  #   results_filestore: /mnt/shared/finished

evaluator:
  jobs: 4
  # Optional. When omitted, CRSBench materializes per-job CPUs from the
  # current visible runtime CPU envelope instead of using a hidden fallback.
  cores_per_job: 4
  # Primary convention: use unified jobs/cores_per_job for symmetric build/verify
  # capacity. CLI follows the same convention:
  #   crsbench evaluator --jobs 4 --cores-per-job 4 ...
  # Advanced asymmetric overrides remain available when build and verify need
  # different concurrency or CPU sizing:
  # build_jobs: 4
  # build_cores_per_job: 4
  # verify_jobs: 8
  # verify_cores_per_job: 2
  # CPU placement is controlled by evaluator CLI:
  #   crsbench evaluator --jobs ... --cores-per-job ... --cpuset ... --skip-cpuset ...
  # (not configured in experiment YAML).
  # Optional evaluator capability tag for matching cpu_tag jobs.
  # cpu_tag: amd-epyc
  # Optional: exit after N seconds when queues stay empty (0 = never).
  # idle_timeout: 0
