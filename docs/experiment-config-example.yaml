# ===== Experiment Identity =====

# Unique identifier for this experiment run.
# Used for organizing results and generating reports.
experiment: "test-experiment"

# ===== Execution Configuration =====

# The number of trials to run for each CRS-benchmark combination.
# More trials provide better statistical significance.
trials: 1

# Evaluation mode: 'delta', 'full', or 'all'
# - delta: Only run delta mode (focus on diff-based analysis)
# - full: Only run full mode (analyze entire codebase)
# - all: Run all available modes for each benchmark (multiplies trials)
mode: delta

# CRS adapter type. Only supported value: "oss-crs".
# Mode (bug-finding vs bug-fixing) is auto-detected from the CRS registry entry YAML.
adapter: oss-crs

# The maximum time in seconds for the entire trial.
# IMPORTANT: Must be greater than build_timeout + run_timeout + verify_timeout
# Default: 86400 (24 hours)
max_total_time: 86400

# ===== Timeout Configuration =====

# Maximum time in seconds for CRS build phase
# Default: 3600 (1 hour)
build_timeout: 3600

# Maximum time in seconds for CRS run phase (fuzzing/analysis)
# Default: 7200 (2 hours)
run_timeout: 7200

# Maximum time in seconds for POV verification phase
# Default: 7200 (2 hours)
verify_timeout: 7200

# For bug-fixing CRS input staging: max POV variants per CPV passed via --pov-dir.
# 1 = single POV per CPV (default), N = multiple variants per CPV, null = all variants.
# max_pov_variants_per_cpv: 1

# ===== CRS and Benchmark Selection =====

# List of CRS (Cyber Reasoning Systems) to evaluate.
# This profile is single-CRS: exactly one CRS entry is allowed.
# Use separate experiments for different CRS setups.
crses:
  - atlantis-c

# Optional compose/runtime overrides for oss-crs adapter.
# crs_compose:
#   docker_registry: us-central1-docker.pkg.dev/aixcc-scoring-prod/oss-fuzz
#
# Optional per-CRS runtime env overrides keyed by CRS name in `crses`.
# crs_overrides:
#   atlantis-c:
#     additional_env:
#       ANTHROPIC_MODEL: claude-sonnet-4-5-20250929

# ===== Benchmark Selection (Choose ONE method) =====

# Method 1: Direct benchmark list
# List specific benchmark projects to test against.
# Each benchmark should exist in the benchmarks/ directory.
benchmarks:
  - curl-delta-02
  - curl-delta-03

# Method 2: Benchmark suite (ALTERNATIVE - mutually exclusive with 'benchmarks')
# Specify a benchmark suite name to load from benchmark-suites/ directory.
# The suite file (e.g., benchmark-suites/crsbench-afc-c.yaml) contains the benchmark list.
# IMPORTANT: You must specify EITHER 'benchmarks' OR 'benchmark_suite', not both.
#
# To use a benchmark suite:
# 1. Comment out the 'benchmarks' field above
# 2. Uncomment and set 'benchmark_suite' below
#
# benchmark_suite: crsbench-afc-c
#
# Available suites in benchmark-suites/:
#   - crsbench-afc-c     (C/C++ benchmarks from AFC)
#   - crsbench-afc-jvm   (JVM benchmarks from AFC)

# ===== Difficulty Control =====

# Difficulty level control (e.g., corpus size, hint availability).
# Higher values typically mean harder/more realistic conditions.
# Range: 1-5 (implementation-dependent)
difficulty_level: 1

# ===== Hints Configuration =====

# Enable hints for CRS evaluation
# When enabled, aggregates hints from all CPVs and provides them to CRS
hints_enabled: false

# SARIF hint level (1-5)
# Controls the amount of information in static analysis hints:
#   1 = Vague (e.g., "Memory Safety Issue")
#   2 = CWE type (e.g., "CWE-416 - Use After Free")
#   3 = + function location
#   4 = + line number ranges
#   5 = + vulnerability name and description
# Set to null to disable SARIF hints
hint_sarif_level: 3

# Pre-fuzz corpus hint level (1-5) [PLACEHOLDER - not yet implemented]
# Controls the size/quality of initial fuzzing corpus:
#   1 = Minimal corpus
#   5 = Comprehensive corpus
# Set to null to disable corpus hints
# hint_corpus_level: null

# ===== Seed Corpus Configuration =====

# Enable seed corpus from previous experiment runs.
# Requires corpus to be collected via 'crsbench benchmark seed-import' first.
# Default: false
seed_corpus_enabled: false

# Maximum relative time (seconds) for seed corpus files.
# Only files discovered within this time from CRS start are used.
# Useful for replicating "first hour" findings from a longer run.
# Set to null to use all available seeds.
# Default: null (use all)
# seed_corpus_max_time: 3600  # Use seeds from first hour only

# ===== LiteLLM Configuration =====

# LiteLLM mode: 'external' or 'self_hosted'
# - external: Uses external LiteLLM service
#   (CRSBENCH_LLM_UPSTREAM_BASE_URL or CRSBENCH_LLM_BASE_URL, plus
#    CRSBENCH_LLM_UPSTREAM_API_KEY or CRSBENCH_LLM_UPSTREAM_MASTER_KEY)
# - self_hosted: Reserved, not implemented yet
# Default: external
litellm_mode: external

# Enable LLM usage tracking via LiteLLM Virtual Keys
# When enabled, generates llm-usage.json with per-trial cost and token metrics.
# Requires CRSBENCH_LLM_* runtime env vars for selected mode.
# Set to false to explicitly disable tracking.
# Default: true
llm_tracking_enabled: true

# ===== Monitoring & Snapshots =====

# Interval in seconds for taking snapshots of CRS progress.
# Snapshots capture coverage, POVs found, patches generated, etc.
# Default: 900 (15 minutes)
snapshot_period: 900

# ===== Verification & Deduplication =====

# How discovered POVs are deduplicated before verification/reporting.
# Options:
#   - patch-based: Group by matched CPV set (default)
#   - stack-based: Group by crash stack signature
#   - status-based: Keep one per verification status type
#   - none: Keep all discovered POVs
pov_dedup_strategy: patch-based

# ===== Resource Management =====

# OPTIONAL: Resource allocation configuration for trials
# This section controls compute resources and API rate limits.
# If omitted, trials will use system defaults.
#
# resources:
#   # Number of CPU cores allocated per trial
#   # Default: 4
#   # Higher values allow more parallelism within each trial
#   cores_per_trial: 8
#
#   # Memory allocation per trial (e.g., "8G", "16G", "32G")
#   # Default: "8G"
#   # Supports standard memory notation (K, M, G, T)
#   memory_per_trial: "16G"
#
#   # OPTIONAL: LiteLLM-specific resource configuration
#   # Controls rate limiting and cost management for LLM API calls
#   litellm:
#     # Maximum concurrent requests to LiteLLM service
#     # Default: 10
#     # Prevents overwhelming the LLM API with too many parallel requests
#     max_concurrent_requests: 20
#
#     # Cost budget in USD for LLM API usage
#     # Default: 100.0
#     # Experiment will halt if this budget is exceeded (if cost tracking is enabled)
#     cost_budget: 200.0
#
#     # Team name for grouping API keys in LiteLLM
#     # Default: Uses experiment name
#     # Useful for organizing API keys by project or research group
#     # team: "crsbench"
#
#     # Maximum budget in USD for the entire team
#     # Default: null (no team-level budget limit)
#     # This sets a spending cap for all API keys in the team combined
#     # Useful for controlling total costs across multiple trials in the same experiment
#     # team_max_budget: 500.0

# ===== Distributed Worker Configuration =====

# OPTIONAL: Configuration for distributed worker nodes
# This section is only relevant when running CRSBench in distributed mode.
# If omitted, workers will use default settings or environment variables.
#
# worker:
#   # Number of parallel jobs each worker should handle
#   # Default: 4
#   # Higher values increase worker throughput but require more resources
#   jobs: 8
#
#   # Redis server for distributed job coordination (host or host:port)
#   # Default: "localhost"
#   # All workers must connect to the same Redis instance
#   redis_host: "redis.example.com:6379"
#
#   # Whether workers should run continuously or exit after completing one job
#   # Default: false
#   # Set to false for one-shot execution (useful for testing or batch processing)
#   continuous: true
#
#   # Minimum free disk space required to accept new jobs
#   # Default: "10GB"
#   # Workers will pause job processing when disk space falls below this threshold
#   # Supported formats: "200GB", "100MB", "1TB", etc.
#   minimum_disk_size: "10GB"
#
#   # Interval (seconds) between disk space checks when paused
#   # Default: 60
#   # How often to check disk space when waiting for space to become available
#   disk_check_interval: 60
#
#   # OPTIONAL: Override experiment filestore path for workers on different machines
#   # Default: null (uses main experiment_filestore setting)
#   # Useful when workers have different filesystem layouts or use local storage
#   # Example: Workers on remote machines might mount shared storage at different paths
#   # experiment_filestore: /mnt/worker/experiment-data
#
#   # OPTIONAL: Override report filestore path for workers on different machines
#   # Default: null (uses main report_filestore setting)
#   # Similar to experiment_filestore override, for report output paths
#   # report_filestore: /mnt/worker/reports
#
#   # OPTIONAL: Override oss-fuzz path for workers on different machines
#   # Default: null (uses main oss_fuzz_path setting)
#   # Useful when workers have oss-fuzz installed at a different location
#   # oss_fuzz_path: /custom/path/to/oss-fuzz
#
#   # OPTIONAL: Override registry directory for workers on different machines
#   # Default: null (uses main registry_dir setting or ./oss-crs/registry)
#   # registry_dir: /custom/path/to/registry
#
#   # OPTIONAL: Override CRS configs directory for workers on different machines
#   # Default: null (uses main crs_configs_dir setting or ./crses/configs)
#   # crs_configs_dir: /custom/path/to/crs-configs
#
#   # OPTIONAL: Override benchmarks root for workers on different machines
#   # Default: null (uses main benchmarks_root setting or ./benchmarks)
#   # benchmarks_root: /custom/path/to/benchmarks
#
#   # OPTIONAL: Override benchmark suites root for workers on different machines
#   # Default: null (uses main benchmark_suites_root setting or ./benchmark-suites)
#   # benchmark_suites_root: /custom/path/to/benchmark-suites
#
#   # OPTIONAL: Override cleanup configuration for workers
#   # Default: null (uses main cleanup settings)
#   # keep_only_results: true
#   # cleanup_after_trial: true
#   # copy_results_after_trial: true
#   # results_filestore: /custom/path/to/results

# ===== Storage Configuration =====

# The folder that will store most of the experiment data.
# Includes trial logs, POVs, patches, and intermediate results.
# Can be local path or cloud storage (gs://, s3://, etc.)
experiment_filestore: /tmp/crsbench/experiment-data

# The folder where HTML reports and summary data will be stored.
# Can be local path or cloud storage (gs://, s3://, etc.)
report_filestore: /tmp/crsbench/report-data

# ===== Cleanup Configuration =====

# Delete bulky artifacts after experiment completes, keeping only essential files.
# Essential files include: metadata.json, snapshots, status markers, output/, input directories.
# Uses whitelist approach - everything not in whitelist is deleted.
# Default: false
keep_only_results: false

# Delete bulky artifacts after each trial completes (more aggressive cleanup).
# Useful for long experiments with many trials to save disk space during execution.
# Default: false
cleanup_after_trial: false

# Copy essential files to results_filestore after each trial completes.
# Requires results_filestore to be set.
# Copying happens immediately after trial ends and BEFORE cleanup.
# Useful for preserving results when cleanup_after_trial=true or when workers may be interrupted.
# Default: false
copy_results_after_trial: false

# Destination path for copying results (contains experiment-data/ and report-data/).
# Used by copy_results_after_trial.
# Dashboard-compatible structure: results_filestore/{folder_name}/experiment-data/ and report-data/
# results_filestore: /opt/crsbench-finished/my-experiment

# ===== Advanced Configuration (Optional) =====

# OPTIONAL: Custom root directory for benchmark projects
# Default: ./benchmarks (relative to current directory)
# Useful when benchmarks are stored in a non-standard location
# benchmarks_root: /custom/path/to/benchmarks

# OPTIONAL: Custom root directory for benchmark suite YAML files
# Default: ./benchmark-suites (relative to current directory)
# Useful when benchmark suites are stored in a non-standard location
# benchmark_suites_root: /custom/path/to/benchmark-suites
