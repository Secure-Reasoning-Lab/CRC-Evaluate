name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Basic checks
  checks:
    name: Checks
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          all-extras: true

      - name: Type check
        run: just typecheck

      - name: Lint
        run: just lint

      - name: Format check
        run: just format-check

      - name: Run unit tests
        run: uv run pytest tests/ -v -n auto -m "not integration"

  # Stage 2a: Format validation (all benchmarks, no Docker)
  format-validation:
    name: Format Validation
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Validate benchmark formats
        run: |
          uv run crsbench ci format sanity-mock-c-delta-01 --no-color
          uv run crsbench ci format sanity-mock-java-delta-01 --no-color
          uv run crsbench ci format afc-xz-full-01 --no-color
          uv run crsbench ci format atlanta-json-java-full-01 --no-color

  # Stage 2b: Sanity checks on mock projects (fail-fast)
  sanity-mock:
    name: Sanity Mock ${{ matrix.project }}
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        project:
          - mock-c
          - mock-java
        include:
          - project: mock-c
            benchmark: sanity-mock-c-delta-01
          - project: mock-java
            benchmark: sanity-mock-java-delta-01
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run all checks on ${{ matrix.project }}
        run: |
          uv run crsbench ci all ${{ matrix.benchmark }} \
            --no-inc-build \
            --force-rebuild \
            --no-color

  # Stage 2c: Sanity checks on real projects (after mocks pass)
  sanity-real:
    name: Sanity Real ${{ matrix.project }}
    needs: [checks, sanity-mock]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project:
          - afc-xz
          - atlanta-json-java
        include:
          - project: afc-xz
            benchmark: afc-xz-full-01
          - project: atlanta-json-java
            benchmark: atlanta-json-java-full-01
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run all checks on ${{ matrix.project }}
        run: |
          uv run crsbench ci all ${{ matrix.benchmark }} \
            --force-rebuild \
            --no-color

  # Stage 3: E2E Bug Finding with CRS
  e2e-bugfinding:
    name: E2E Bug Finding
    needs: [sanity-mock]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run E2E experiment
        id: e2e-run
        run: |
          EXPERIMENT_DIR=$(mktemp -d)
          REPORT_DIR=$(mktemp -d)
          echo "experiment_dir=$EXPERIMENT_DIR" >> "$GITHUB_OUTPUT"

          # Generate config with random temp directories
          sed \
            -e "s|PLACEHOLDER_EXPERIMENT|$EXPERIMENT_DIR|" \
            -e "s|PLACEHOLDER_REPORT|$REPORT_DIR|" \
            ci-tests/pov-e2e-test.yaml > /tmp/pov-e2e-config.yaml

          uv run crsbench run \
            --experiment-config /tmp/pov-e2e-config.yaml

      - name: Verify all answer POVs found
        run: |
          RESULT_DIR="${{ steps.e2e-run.outputs.experiment_dir }}"
          FAILED=0

          # Expected CPVs per benchmark/harness
          # mock-c: cpv_0 in fuzz_process_input_header, cpv_1 in fuzz_parse_buffer_section
          # mock-java: cpv_0 in OssFuzz1
          declare -A EXPECTED
          EXPECTED["sanity-mock-c-delta-01/fuzz_process_input_header"]="cpv_0"
          EXPECTED["sanity-mock-c-delta-01/fuzz_parse_buffer_section"]="cpv_1"
          EXPECTED["sanity-mock-java-delta-01/OssFuzz1"]="cpv_0"

          for key in "${!EXPECTED[@]}"; do
            bench=$(echo "$key" | cut -d'/' -f1)
            harness=$(echo "$key" | cut -d'/' -f2)
            expected_cpv="${EXPECTED[$key]}"

            POV_STORE=$(find "$RESULT_DIR" -path "*/$bench/$harness/*/trial-*/povs/pov_store.json" | head -1)

            if [ -z "$POV_STORE" ]; then
              echo "FAIL: No pov_store.json for $bench/$harness"
              FAILED=1
              continue
            fi

            # Check if expected CPV is in cpv_matched of any POV
            if python3 -c "
          import json, sys
          with open('$POV_STORE') as f:
              data = json.load(f)
          cpvs = set()
          for pov in data.get('povs', {}).values():
              for cpv in pov.get('cpv_matched', []):
                  cpvs.add(cpv)
          if '$expected_cpv' not in cpvs:
              sys.exit(1)
          "; then
              echo "PASS: $bench/$harness found $expected_cpv"
            else
              echo "FAIL: $bench/$harness missing $expected_cpv"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "E2E FAILED: Not all answer POVs were found"
            exit 1
          fi
          echo "E2E PASSED: All answer POVs found for mock-c and mock-java"
