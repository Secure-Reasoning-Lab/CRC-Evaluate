name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Basic checks
  checks:
    name: Checks
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          all-extras: true

      - name: Type check
        run: just typecheck

      - name: Lint
        run: just lint

      - name: Format check
        run: just format-check

      - name: Run unit tests
        run: uv run pytest tests/ -v -n auto -m "not integration"

  # Stage 2a: Format validation (no Docker)
  format-validation:
    name: Format Validation
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Validate benchmark formats
        run: |
          uv run crsbench benchmark ci format sanity-mock-c-delta-01 --no-color
          uv run crsbench benchmark ci format sanity-mock-java-delta-01 --no-color
          # uv run crsbench benchmark ci format afc-xz-full-01 --no-color
          # uv run crsbench benchmark ci format atlanta-json-java-full-01 --no-color
          # uv run crsbench benchmark ci format afc-libxml2-full-01 --no-color
          # uv run crsbench benchmark ci format afc-apache-commons-compress-delta-01 --no-color

  # Stage 2b: Sanity checks on mock projects (fail-fast)
  sanity-mock:
    name: Sanity Mock ${{ matrix.project }}
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        project:
          - mock-c
          - mock-java
        include:
          - project: mock-c
            benchmark: sanity-mock-c-delta-01
          - project: mock-java
            benchmark: sanity-mock-java-delta-01
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run all checks on ${{ matrix.project }}
        run: |
          uv run crsbench benchmark ci all ${{ matrix.benchmark }} \
            --force-rebuild \
            --no-color

  # # Stage 2c: Sanity checks on real projects (after mocks pass)
  # sanity-real:
  #   name: Sanity Real ${{ matrix.project }}
  #   needs: [checks, sanity-mock]
  #   runs-on: [self-hosted, linux, crs]
  #   timeout-minutes: 60
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       project:
  #         - afc-xz
  #         - atlanta-json-java
  #       include:
  #         - project: afc-xz
  #           benchmark: afc-xz-full-01
  #         - project: atlanta-json-java
  #           benchmark: atlanta-json-java-full-01
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         submodules: recursive
  #         token: ${{ secrets.PAT_TOKEN }}
  #         persist-credentials: false
  #
  #     - name: Configure Team-Atlanta access
  #       run: |
  #         git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"
  #
  #     - uses: ./.github/actions/setup
  #       with:
  #         require-docker: true
  #
  #     - name: Run all checks on ${{ matrix.project }}
  #       run: |
  #         uv run crsbench benchmark ci all ${{ matrix.benchmark }} \
  #           --force-rebuild \
  #           --no-color

  # Stage 3: Parallel smoke checks with result validation
  smoke-parallel:
    name: Smoke (Bugfinding + Bugfixing, Parallel)
    # needs: [sanity-mock, sanity-real]
    needs: [sanity-mock]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Validate LiteLLM health and auth
        env:
          CRSBENCH_LLM_UPSTREAM_BASE_URL: ${{ secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          CRSBENCH_LLM_BASE_URL: ${{ secrets.CRSBENCH_LLM_BASE_URL || secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          CRSBENCH_LLM_UPSTREAM_MASTER_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_MASTER_KEY }}
          CRSBENCH_LLM_UPSTREAM_API_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_API_KEY }}
        run: |
          uv run python scripts/ci-tests/litellm_preflight.py --mode external

      - name: Run validated smoke suites (parallel)
        env:
          # run-local.sh manages an isolated temporary Valkey on a random port.
          # 8 cores/trial x 3 harnesses = 24 cores per suite
          SMOKE_CPUSET_BUGFINDING: 0-23
          SMOKE_CPUSET_BUGFIXING: 24-47
          # External LiteLLM endpoint for bugfixing CRS smoke.
          CRSBENCH_LLM_UPSTREAM_BASE_URL: ${{ secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          # Optional explicit control-plane endpoint (defaults to upstream URL in runtime resolver).
          CRSBENCH_LLM_BASE_URL: ${{ secrets.CRSBENCH_LLM_BASE_URL || secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          # Canonical external-mode credentials.
          CRSBENCH_LLM_UPSTREAM_MASTER_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_MASTER_KEY }}
          CRSBENCH_LLM_UPSTREAM_API_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_API_KEY }}
        run: |
          ./scripts/ci-tests/run-local.sh smoke
