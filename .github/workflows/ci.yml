name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Basic checks
  checks:
    name: Checks
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 15
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          mkdir -p "$workspace"

          cleanup_workspace() {
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          }

          workspace_dirty() {
            find "$workspace" -mindepth 1 -maxdepth 1 -print -quit | grep -q .
          }

          cleanup_workspace
          if workspace_dirty; then
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is required to clean root-owned workspace leftovers in $workspace" >&2
              find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
              exit 1
            fi
            docker run --rm -v "$workspace:/cleanup-path" alpine:3.20 \
              sh -c 'rm -rf /cleanup-path/* /cleanup-path/.[!.]* /cleanup-path/..?* 2>/dev/null'
          fi
          cleanup_workspace
          if workspace_dirty; then
            echo "workspace cleanup failed: $workspace" >&2
            find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          clean: false
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          all-extras: true

      - name: Type check
        run: just typecheck

      - name: Lint
        run: just lint

      - name: Format check
        run: just format-check

      - name: Benchmark path policy check
        run: uv run python scripts/ci-tests/check_benchmark_paths.py

      - name: Run unit tests
        run: uv run pytest tests/ -v -n auto -m "not integration"

  # Stage 2a: Format validation (no Docker)
  format-validation:
    name: Format Validation
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 10
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          mkdir -p "$workspace"

          cleanup_workspace() {
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          }

          workspace_dirty() {
            find "$workspace" -mindepth 1 -maxdepth 1 -print -quit | grep -q .
          }

          cleanup_workspace
          if workspace_dirty; then
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is required to clean root-owned workspace leftovers in $workspace" >&2
              find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
              exit 1
            fi
            docker run --rm -v "$workspace:/cleanup-path" alpine:3.20 \
              sh -c 'rm -rf /cleanup-path/* /cleanup-path/.[!.]* /cleanup-path/..?* 2>/dev/null'
          fi
          cleanup_workspace
          if workspace_dirty; then
            echo "workspace cleanup failed: $workspace" >&2
            find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          clean: false
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Validate benchmark formats
        run: |
          uv run crsbench benchmark ci format sanity-mock-c-delta-01 --no-color
          uv run crsbench benchmark ci format sanity-mock-java-delta-01 --no-color
          # uv run crsbench benchmark ci format afc-xz-full-01 --no-color
          # uv run crsbench benchmark ci format atlanta-json-java-full-01 --no-color
          # uv run crsbench benchmark ci format afc-libxml2-full-01 --no-color
          # uv run crsbench benchmark ci format afc-apache-commons-compress-delta-01 --no-color

  # Stage 2b: Sanity checks on mock projects (fail-fast)
  sanity-mock:
    name: Sanity Mock ${{ matrix.project }}
    needs: [checks]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        project:
          - mock-c
          - mock-java
        include:
          - project: mock-c
            benchmark: sanity-mock-c-delta-01
          - project: mock-java
            benchmark: sanity-mock-java-delta-01
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          mkdir -p "$workspace"

          cleanup_workspace() {
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          }

          workspace_dirty() {
            find "$workspace" -mindepth 1 -maxdepth 1 -print -quit | grep -q .
          }

          cleanup_workspace
          if workspace_dirty; then
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is required to clean root-owned workspace leftovers in $workspace" >&2
              find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
              exit 1
            fi
            docker run --rm -v "$workspace:/cleanup-path" alpine:3.20 \
              sh -c 'rm -rf /cleanup-path/* /cleanup-path/.[!.]* /cleanup-path/..?* 2>/dev/null'
          fi
          cleanup_workspace
          if workspace_dirty; then
            echo "workspace cleanup failed: $workspace" >&2
            find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          clean: false
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run all checks on ${{ matrix.project }}
        run: |
          uv run crsbench benchmark ci all ${{ matrix.benchmark }} \
            --force-rebuild \
            --no-color

  # # Stage 2c: Sanity checks on real projects (after mocks pass)
  # sanity-real:
  #   name: Sanity Real ${{ matrix.project }}
  #   needs: [checks, sanity-mock]
  #   runs-on: [self-hosted, linux, crs]
  #   timeout-minutes: 60
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       project:
  #         - afc-xz
  #         - atlanta-json-java
  #       include:
  #         - project: afc-xz
  #           benchmark: afc-xz-full-01
  #         - project: atlanta-json-java
  #           benchmark: atlanta-json-java-full-01
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         submodules: recursive
  #         token: ${{ secrets.PAT_TOKEN }}
  #         persist-credentials: false
  #
  #     - name: Configure Team-Atlanta access
  #       run: |
  #         git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"
  #
  #     - uses: ./.github/actions/setup
  #       with:
  #         require-docker: true
  #
  #     - name: Run all checks on ${{ matrix.project }}
  #       run: |
  #         uv run crsbench benchmark ci all ${{ matrix.benchmark }} \
  #           --force-rebuild \
  #           --no-color

  # Stage 3: Parallel smoke checks with result validation
  smoke-parallel:
    name: Smoke (Bugfinding + Bugfixing, Parallel)
    # needs: [sanity-mock, sanity-real]
    needs: [sanity-mock]
    runs-on: [self-hosted, linux, crs]
    timeout-minutes: 90
    concurrency:
      group: crsbench-smoke
      cancel-in-progress: false
    steps:
      - name: Reset self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          mkdir -p "$workspace"

          cleanup_workspace() {
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          }

          workspace_dirty() {
            find "$workspace" -mindepth 1 -maxdepth 1 -print -quit | grep -q .
          }

          cleanup_workspace
          if workspace_dirty; then
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker is required to clean root-owned workspace leftovers in $workspace" >&2
              find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
              exit 1
            fi
            docker run --rm -v "$workspace:/cleanup-path" alpine:3.20 \
              sh -c 'rm -rf /cleanup-path/* /cleanup-path/.[!.]* /cleanup-path/..?* 2>/dev/null'
          fi
          cleanup_workspace
          if workspace_dirty; then
            echo "workspace cleanup failed: $workspace" >&2
            find "$workspace" -mindepth 1 -maxdepth 3 -ls | sed -n '1,200p' || true
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          clean: false
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Configure Team-Atlanta access
        run: |
          git config --global url."https://x-access-token:${{ secrets.TEAM_ATLANTA_PAT }}@github.com/Team-Atlanta/".insteadOf "git@github.com:Team-Atlanta/"

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Validate smoke config files
        run: |
          ./scripts/ci-tests/run-local.sh smoke-validate-config

      - name: Run smoke suites (worker + evaluator + orchestrator)
        env:
          # Source-of-truth smoke configs:
          SMOKE_BUGFINDING_CONFIG: experiment-configs/sanity-bugfinding/atlantis-multilang-given_fuzzer-default-delta.yaml
          SMOKE_BUGFIXING_CONFIG: experiment-configs/sanity-bugfixing/crs-claude-code-delta-sanity-smoke.yaml
          # run-local.sh manages an isolated temporary Valkey on a random port.
          # GitHub self-hosted runners may use Docker's systemd cgroup driver.
          # Smoke must avoid cpuset/cgroup mode unless the runner is explicitly
          # configured for Docker cgroupfs.
          SMOKE_NO_CPUSET: "1"
          # Optional cpuset partitioning for dedicated cgroupfs-capable runners.
          SMOKE_CPUSET_BUGFINDING: 0-23
          SMOKE_CPUSET_BUGFIXING: 24-47
          # External LiteLLM endpoint for bugfixing CRS smoke.
          CRSBENCH_LLM_UPSTREAM_BASE_URL: ${{ secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          # Optional explicit control-plane endpoint (defaults to upstream URL in runtime resolver).
          CRSBENCH_LLM_BASE_URL: ${{ secrets.CRSBENCH_LLM_BASE_URL || secrets.CRSBENCH_LLM_UPSTREAM_BASE_URL }}
          # Canonical external-mode credentials.
          CRSBENCH_LLM_UPSTREAM_MASTER_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_MASTER_KEY }}
          CRSBENCH_LLM_UPSTREAM_API_KEY: ${{ secrets.CRSBENCH_LLM_UPSTREAM_API_KEY }}
        run: |
          ./scripts/ci-tests/run-local.sh smoke-run

      - name: Post-verify smoke results (crsbench verify + patch-verify)
        run: |
          ./scripts/ci-tests/run-local.sh smoke-post-verify
