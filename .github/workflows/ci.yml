name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: 'Run full integration tests (Stage 3-4)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Basic checks (sequential in single job)
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          all-extras: true

      - name: Type check
        run: just typecheck

      - name: Lint
        run: just lint

      - name: Format check
        run: just format-check

      - name: Run unit tests
        run: uv run pytest tests/ -v -n auto -m "not integration"

  # Stage 2: Sanity checks with mock-c and mock-java (3 parallel jobs)
  # TODO: Re-enable when Team-Atlanta repo access is resolved (fork to sslab-gatech or deploy keys)
  # Currently disabled due to cross-org PAT limitations (see issue #16)
  sanity-verify:
    name: Sanity Verify
    needs: [checks]
    if: false  # Disabled until Team-Atlanta repo access is resolved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Verify mock-c
        run: |
          uv run crsbench verify benchmarks/sanity-mock-c-delta-01 \
            --force-rebuild \
            --output verify-mock-c.json \
            --format json
          echo "=== Verify mock-c Results ==="
          cat verify-mock-c.json
          python3 ci-tests/check_ci_results.py verify \
            benchmarks/sanity-mock-c-delta-01 \
            verify-mock-c.json

      - name: Verify mock-java
        run: |
          uv run crsbench verify benchmarks/sanity-mock-java-delta-01 \
            --force-rebuild \
            --output verify-mock-java.json \
            --format json
          echo "=== Verify mock-java Results ==="
          cat verify-mock-java.json
          python3 ci-tests/check_ci_results.py verify \
            benchmarks/sanity-mock-java-delta-01 \
            verify-mock-java.json

  sanity-patch-verify:
    name: Sanity Patch-Verify
    needs: [checks]
    if: false  # Disabled until Team-Atlanta repo access is resolved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Patch-verify mock-c
        run: |
          uv run crsbench patch-verify benchmarks/sanity-mock-c-delta-01 \
            --force-rebuild \
            --output patch-verify-mock-c.json \
            --format json
          echo "=== Patch-verify mock-c Results ==="
          cat patch-verify-mock-c.json
          python3 ci-tests/check_ci_results.py patch-verify patch-verify-mock-c.json

      - name: Patch-verify mock-java
        run: |
          uv run crsbench patch-verify benchmarks/sanity-mock-java-delta-01 \
            --force-rebuild \
            --output patch-verify-mock-java.json \
            --format json
          echo "=== Patch-verify mock-java Results ==="
          cat patch-verify-mock-java.json
          python3 ci-tests/check_ci_results.py patch-verify patch-verify-mock-java.json

  sanity-coverage:
    name: Sanity Coverage
    needs: [checks]
    if: false  # Disabled until Team-Atlanta repo access is resolved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Coverage mock-c
        run: |
          # Create temporary corpus directory with random seed input
          CORPUS_DIR=$(mktemp -d)
          head -c 64 /dev/urandom > "$CORPUS_DIR/seed_input"

          uv run crsbench coverage benchmarks/sanity-mock-c-delta-01 \
            --corpus-dir "$CORPUS_DIR" \
            --force-rebuild \
            --output coverage-mock-c.json \
            --format json

          rm -rf "$CORPUS_DIR"
          echo "=== Coverage mock-c Results ==="
          cat coverage-mock-c.json

      - name: Coverage mock-java
        run: |
          # Create temporary corpus directory with random seed input
          CORPUS_DIR=$(mktemp -d)
          head -c 64 /dev/urandom > "$CORPUS_DIR/seed_input"

          uv run crsbench coverage benchmarks/sanity-mock-java-delta-01 \
            --corpus-dir "$CORPUS_DIR" \
            --force-rebuild \
            --output coverage-mock-java.json \
            --format json

          rm -rf "$CORPUS_DIR"
          echo "=== Coverage mock-java Results ==="
          cat coverage-mock-java.json

  # Stage 3: Integration tests with real projects
  # TODO: Re-enable when Team-Atlanta repo access is resolved
  integration:
    name: Integration ${{ matrix.benchmark }}
    needs: [checks]
    if: false  # Disabled until Team-Atlanta repo access is resolved
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        benchmark:
          - afc-libxml2-full-01        # C project
          - afc-apache-commons-compress-delta-01  # Java project
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Verify ${{ matrix.benchmark }}
        run: |
          uv run crsbench verify benchmarks/${{ matrix.benchmark }} \
            --force-rebuild \
            --output verify-results.json \
            --format json
          echo "=== Verify Results ==="
          cat verify-results.json
          python3 ci-tests/check_ci_results.py verify \
            benchmarks/${{ matrix.benchmark }} \
            verify-results.json

      - name: Patch-verify ${{ matrix.benchmark }}
        run: |
          uv run crsbench patch-verify benchmarks/${{ matrix.benchmark }} \
            --force-rebuild \
            --output patch-verify-results.json \
            --format json
          echo "=== Patch-verify Results ==="
          cat patch-verify-results.json
          python3 ci-tests/check_ci_results.py patch-verify patch-verify-results.json

  # Stage 4: Bug Finding E2E
  # TODO: Re-enable when Team-Atlanta repo access is resolved
  e2e-bugfinding:
    name: E2E Bug Finding
    needs: [checks]
    if: false  # Disabled until Team-Atlanta repo access is resolved
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup
        with:
          require-docker: true

      - name: Run E2E experiment
        run: uv run crsbench --experiment-config experiment-configs/coverage-e2e-test.yaml

      - name: Check E2E results
        run: |
          echo "=== E2E Experiment Results ==="
          RESULT_DIR="/tmp/crsbench/experiments/coverage-e2e-test"

          if [ ! -d "$RESULT_DIR" ]; then
            echo "ERROR: Experiment directory not found: $RESULT_DIR"
            exit 1
          fi

          echo "Experiment directory structure:"
          find "$RESULT_DIR" -type d | head -20

          TRIAL_COUNT=$(find "$RESULT_DIR" -type d -name "trial-*" | wc -l)
          echo "Trial directories found: $TRIAL_COUNT"

          if [ "$TRIAL_COUNT" -eq 0 ]; then
            echo "ERROR: No trial directories found"
            exit 1
          fi

          echo "E2E test completed successfully"
