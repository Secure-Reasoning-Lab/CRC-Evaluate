[project]
name = "crsbench"
version = "0.1.0"
description = "A benchmark suite for evaluating Cyber Reasoning Systems (CRS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=24.1.0",
    "asyncio-throttle>=1.0.2",
    "click>=8.3.0",
    "gitpython>=3.1.44",
    "jinja2>=3.1.6",
    "langchain>=0.3.27",
    "langgraph>=0.6.8",
    "litellm>=1.77.5",
    "loguru>=0.7.3",
    "pexpect>=4.9.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "redis>=4.3.4",
    "rich>=14.1.0",
    "rq>=1.11.1",
    "typer>=0.19.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
crsbench = "crsbench.run_experiment:main"

[tool.setuptools.packages.find]
include = ["crsbench*"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring external services like LiteLLM, Redis, etc.)",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
