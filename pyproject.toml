[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crsbench"
version = "0.1.0"
description = "A benchmark suite for evaluating Cyber Reasoning Systems (CRS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "asyncio-throttle>=1.0.2",
    "click>=8.3.0",
    "gitpython>=3.1.44",
    "jinja2>=3.1.6",
    "langchain>=0.3.27",
    "langgraph>=0.6.8",
    "litellm>=1.77.5",
    "loguru>=0.7.3",
    "pexpect>=4.9.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "redis>=4.3.4",
    "rich>=14.1.0",
    "rq>=1.11.1",
    "typer>=0.19.2",
    "oss-crs",
    "claude-agent-sdk>=0.1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "datamodel-code-generator>=0.35.0",
]

[project.scripts]
crsbench = "crsbench.run_experiment:main"

[tool.setuptools.packages.find]
include = ["crsbench*"]

[tool.uv]
package = true

[tool.uv.sources]
oss-crs = { path = "oss-crs", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring external services like LiteLLM, Redis, etc.)",
    "slow: marks tests as slow (e.g., E2E tests with Docker builds)",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "datamodel-code-generator>=0.35.0",
    "ty>=0.0.4",
    "ruff>=0.8.0",
]

[tool.ty.src]
exclude = [
    "crsbench/hint_generation/sarif_model.py",
    "crsbench/migration/"
]
include = [
    "crsbench",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["crsbench"]
exclude = [
    "crsbench/hint_generation/sarif_model.py",
    "crsbench/migration/",
    "tests/",
    "oss-fuzz/",
    "oss-patch/",
    "oss-crs/",
    "oss-crs-registry/",
    "snapshot-examples/",
    "scripts/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "N",      # pep8-naming
    "ARG",    # flake8-unused-arguments
    "TD",     # flake8-todos
    "TC",     # flake8-type-checking
    "ERA",    # eradicate
    # "ANN",    # flake8-annotations (disabled for now)
    # "BLE",    # flake8-blind-except (too strict for this codebase)
    # "FBT",    # flake8-boolean-trap (too strict for this codebase)
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "PT",     # flake8-pytest-style
    "PIE",    # flake8-pie
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"