[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crsbench"
dynamic = ["version"]
description = "A benchmark suite for evaluating Cyber Reasoning Systems (CRS)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=24.1.0",
    "argcomplete>=3.0.0",
    "asyncio-throttle>=1.0.2",
    "click>=8.3.0",
    "gitpython>=3.1.44",
    "humanfriendly>=10.0",
    "jinja2>=3.1.6",
    "langchain>=0.3.27",
    "langgraph>=0.6.8",
    "litellm>=1.77.5",
    "loguru>=0.7.3",
    "pexpect>=4.9.0",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "redis>=4.3.4",
    "rich>=14.1.0",
    "rq>=2.6.1",
    "typer>=0.19.2",
    "oss-crs",
    "claude-agent-sdk>=0.1.8",
    "setproctitle>=1.3.7",
    "google-cloud-compute>=1.46.0",
    "huggingface_hub>=0.25.0",
    "matplotlib>=3.10.8",
    "InquirerPy>=0.3.4",
    "textual>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "datamodel-code-generator>=0.35.0",
]

[project.scripts]
crsbench = "crsbench.run_experiment:main"

[tool.setuptools.packages.find]
include = ["crsbench*"]

[tool.setuptools.package-data]
"crsbench.cloud.gce" = ["startup/*.sh"]

[tool.uv]
package = true

[tool.uv.sources]
oss-crs = { path = "oss-crs", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: Tests requiring Docker, external repos, or external services",
    "mcp: Tests requiring MCP server connection",
    "real_checkout: Tests that exercise _ensure_checkout with mocked subprocess",
]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "datamodel-code-generator>=0.35.0",
    "ty>=0.0.4",
    "ruff>=0.8.0",
    "pytest-xdist>=3.8.0",
]

[tool.ty.src]
exclude = [
    "crsbench/hint_generation/sarif_model.py",
    "crsbench/_version.py",
    "crsbench/_submodule_commits.py",
]
include = [
    "crsbench",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["crsbench"]
extend-exclude = [
    "crsbench/hint_generation/sarif_model.py",
    "crsbench/_version.py",
    "crsbench/_submodule_commits.py",
    "tests/",
    "oss-fuzz/",
    "oss-crs/",
    "oss-crs-registry/",
    "snapshot-examples/",
    "scripts/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "N",      # pep8-naming
    "ARG",    # flake8-unused-arguments
    "TD",     # flake8-todos
    "TC",     # flake8-type-checking
    "ERA",    # eradicate
    # "ANN",    # flake8-annotations (disabled for now)
    # "BLE",    # flake8-blind-except (too strict for this codebase)
    # "FBT",    # flake8-boolean-trap (too strict for this codebase)
    "FBT002", # flake8-boolean-trap
    "FBT003", # flake8-boolean-trap
    "C4",     # flake8-comprehensions
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "PT",     # flake8-pytest-style
    "PIE",    # flake8-pie
    "T20",    # flake8-print (no print statements)
    "TID",    # flake8-tidy-imports (for banned imports)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "TD002",  # Missing author in TODO - existing codebase convention
    "TD003",  # Missing issue link for TODO - existing codebase convention
]

[tool.ruff.lint.per-file-ignores]
"crsbench/utils/logger.py" = [
    "N802",    # getLogger follows standard logging interface naming
    "TID251",  # logger.py is allowed to import logging module
]
# Test files have relaxed linting - allow unittest style, unused args in fixtures, etc.
"tests/**/*.py" = [
    "ARG002",   # Unused method arguments (common in test fixtures)
    "PT009",    # Use regular assert instead of unittest-style (legacy tests)
    "PT011",    # pytest.raises too broad (acceptable in tests)
    "PT027",    # Use pytest.raises instead of assertRaises (legacy tests)
    "PT006",    # Wrong type for parametrize first arg (legacy tests)
    "PTH103",   # os.makedirs (acceptable in tests)
    "PTH110",   # os.path.exists (acceptable in tests)
    "PTH112",   # os.path.isdir (acceptable in tests)
    "PTH118",   # os.path.join (acceptable in tests)
    "PTH123",   # open() instead of Path.open() (acceptable in tests)
    "E402",     # Module import not at top (acceptable in tests)
    "F841",     # Unused variable (common in tests for side effects)
    "ERA001",   # Commented-out code (acceptable in tests for documentation)
    "B007",     # Loop variable not used (acceptable in tests)
    "T201",     # print allowed in tests for debugging
    "TID251",   # logging module allowed in tests
]
"tests/fixtures/**/*.py" = ["PTH123"]  # Fixtures can use open()
"crsbench/genconfig/generator.py" = [
    "T201",     # print is intentional for interactive CLI section headers
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use `from crsbench.utils.logger import get_logger` instead"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools_scm]
write_to = "crsbench/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.1.0.dev0+unknown"
